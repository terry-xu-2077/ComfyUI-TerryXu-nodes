[project]
name = "comfyui-terryxu-nodes"
version = "1.0.5"
description = "ComfyUI workflow utilities: H3 prompt editor, media loading, wiring, switches, memory cleanup, and performance monitoring."
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "psutil>=5.9.0,<8",
    "typing-extensions>=4.8.0",
    "nvidia-ml-py>=12.535.133,<14",
]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/terry-xu-2077/ComfyUI-TerryXu-nodes"
Documentation = "https://github.com/terry-xu-2077/ComfyUI-TerryXu-nodes#readme"
"Bug Tracker" = "https://github.com/terry-xu-2077/ComfyUI-TerryXu-nodes/issues"

[tool.comfy]
PublisherId = "terryxu"
DisplayName = "TerryXu"
Icon = "https://raw.githubusercontent.com/terry-xu-2077/ComfyUI-TerryXu-nodes/main/assets/icon.png"
Banner = "https://raw.githubusercontent.com/terry-xu-2077/ComfyUI-TerryXu-nodes/main/assets/banner.jpg"
