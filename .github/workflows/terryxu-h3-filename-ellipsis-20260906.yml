name: TerryXu H3 filename ellipsis

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terryxu-h3-filename-ellipsis-20260906.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Limit long H3 asset names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/h3_shared_menus.js')
          text = path.read_text(encoding='utf-8')

          old = '  const name = document.createElement("b"); name.textContent = asset.name;'
          new = '  const name = document.createElement("b"); name.textContent = asset.name; name.title = asset.name;'
          if old not in text:
              raise RuntimeError('asset name anchor not found')
          text = text.replace(old, new, 1)

          old_css = '.terry-h3-role-info b{font-size:11px}.terry-h3-role-info small{margin-top:3px;font-size:9.5px;opacity:.52;white-space:normal;line-height:1.35}'
          new_css = '.terry-h3-role-info b{font-size:11px}.terry-h3-role-row .terry-h3-role-info b{max-width:52%}.terry-h3-role-info small{margin-top:3px;font-size:9.5px;opacity:.52;white-space:normal;line-height:1.35}'
          if old_css not in text:
              raise RuntimeError('asset name css anchor not found')
          text = text.replace(old_css, new_css, 1)

          path.write_text(text, encoding='utf-8')

          wf = Path('.github/workflows/terryxu-h3-filename-ellipsis-20260906.yml')
          if wf.exists():
              wf.unlink()
          for folder in (Path('.github/workflows'), Path('.github')):
              try:
                  folder.rmdir()
              except OSError:
                  pass
          PY

      - name: Validate
        shell: bash
        run: |
          node --check web/h3_shared_menus.js
          grep -q 'max-width:52%' web/h3_shared_menus.js
          grep -q 'name.title = asset.name' web/h3_shared_menus.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Truncate long H3 reference filenames"
          git push origin main
