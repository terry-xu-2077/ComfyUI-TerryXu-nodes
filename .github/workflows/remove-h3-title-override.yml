name: Remove H3 title override source
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-h3-title-override.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove frontend H3 title override
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('web/h3_ui_i18n.js')
          s = p.read_text(encoding='utf-8')
          old = '  node.title = "TerryXu | H3 Prompt Editor";\n'
          if old not in s:
              raise SystemExit('expected H3 title override not found')
          s = s.replace(old, '', 1)
          p.write_text(s, encoding='utf-8')

          # One-shot workflow removes itself.
          Path('.github/workflows/remove-h3-title-override.yml').unlink()
          PY
      - name: Validate canonical title sources
        run: |
          node --check web/h3_ui_i18n.js
          node --check web/h3_prompt_editor.js
          python -m compileall -q __init__.py nodes
          ! grep -R -F 'node.title = "TerryXu | H3 Prompt Editor"' web
          ! grep -R -F 'TerryXu H3 提示词编辑器' web nodes locales __init__.py
          grep -Fq 'display_name="📃 H3提示词编辑器"' nodes/h3_prompt_editor.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          zh = json.loads(Path('locales/zh/nodeDefs.json').read_text(encoding='utf-8'))
          en = json.loads(Path('locales/en/nodeDefs.json').read_text(encoding='utf-8'))
          assert zh['TerryXuH3PromptEditor']['display_name'] == '📃 H3提示词编辑器'
          assert en['TerryXuH3PromptEditor']['display_name'] == '📃 H3 Prompt Editor'
          PY
      - name: Commit
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove H3 frontend title override"
          git push
