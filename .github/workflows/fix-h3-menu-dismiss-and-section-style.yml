name: Fix H3 menu dismiss and section style
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-h3-menu-dismiss-and-section-style.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch H3 menu dismissal and section keyword style
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('web/h3_shared_menus.js')
          s = p.read_text(encoding='utf-8')
          old = '''  const onBlur = () => setTimeout(() => { if (!controller.menu?.matches?.(\":hover\")) closeMenu(controller); }, 120);\n  const onPointer = (event) => event.stopPropagation();\n  editor.addEventListener(\"beforeinput\", onBeforeInput); editor.addEventListener(\"input\", onInput); editor.addEventListener(\"keydown\", onKeyDown); editor.addEventListener(\"blur\", onBlur); editor.addEventListener(\"pointerdown\", onPointer);\n  controller.cleanup = () => { closeMenu(controller); editor.removeEventListener(\"beforeinput\", onBeforeInput); editor.removeEventListener(\"input\", onInput); editor.removeEventListener(\"keydown\", onKeyDown); editor.removeEventListener(\"blur\", onBlur); editor.removeEventListener(\"pointerdown\", onPointer); };\n'''
          new = '''  const onBlur = () => setTimeout(() => { if (!controller.menu?.matches?.(\":hover\")) closeMenu(controller); }, 120);\n  const onPointer = (event) => event.stopPropagation();\n  const onDocumentPointer = (event) => {\n    const menu = controller.menu;\n    if (!menu || menu.contains(event.target)) return;\n    closeMenu(controller);\n  };\n  editor.addEventListener(\"beforeinput\", onBeforeInput); editor.addEventListener(\"input\", onInput); editor.addEventListener(\"keydown\", onKeyDown); editor.addEventListener(\"blur\", onBlur); editor.addEventListener(\"pointerdown\", onPointer);\n  document.addEventListener(\"pointerdown\", onDocumentPointer, true);\n  controller.cleanup = () => { closeMenu(controller); editor.removeEventListener(\"beforeinput\", onBeforeInput); editor.removeEventListener(\"input\", onInput); editor.removeEventListener(\"keydown\", onKeyDown); editor.removeEventListener(\"blur\", onBlur); editor.removeEventListener(\"pointerdown\", onPointer); document.removeEventListener(\"pointerdown\", onDocumentPointer, true); };\n'''
          if old not in s:
              raise SystemExit('shared menu attach block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('web/h3_rich_text.js')
          s = p.read_text(encoding='utf-8')
          old = '.terry-h3-type-section{display:inline!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;color:rgba(205,205,205,.66)!important;font-weight:700!important;font-size:12px!important}'
          new = '.terry-h3-type-section{display:inline!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;color:rgba(218,218,218,.76)!important;font-weight:700!important;font-size:13px!important;letter-spacing:.1px!important}'
          if old not in s:
              raise SystemExit('section style rule not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/fix-h3-menu-dismiss-and-section-style.yml').unlink()
          PY
      - name: Validate
        run: |
          node --check web/h3_shared_menus.js
          node --check web/h3_rich_text.js
          grep -Fq 'document.addEventListener("pointerdown", onDocumentPointer, true)' web/h3_shared_menus.js
          grep -Fq 'font-size:13px!important' web/h3_rich_text.js
          test ! -e .github/workflows/fix-h3-menu-dismiss-and-section-style.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix H3 asset menu dismissal and section style"
          git push
