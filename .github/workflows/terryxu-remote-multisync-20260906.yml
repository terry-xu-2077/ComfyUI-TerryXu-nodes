name: TerryXu remote multi-control sync

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("web/line_switch.js")
          t = p.read_text(encoding="utf-8")
          old = """    if (adapter.set(target, value) !== false) {
      properties(node)[REMOTE_VALUE_PROPERTY] = value;
      node.graph?.setDirtyCanvas?.(true, true);
    }
"""
          new = """    if (adapter.set(target, value) !== false) {
      // The controlled node is the single source of truth. Any successful
      // remote write is followed by a read-back and a refresh of every remote.
      const actual = adapter.describe?.(target)?.value ?? value;
      properties(node)[REMOTE_VALUE_PROPERTY] = actual;
      refreshAllRemotes();
      target.graph?.setDirtyCanvas?.(true, true);
      node.graph?.setDirtyCanvas?.(true, true);
    }
"""
          if old not in t:
              raise SystemExit("remote callback block not found")
          p.write_text(t.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/terryxu-remote-multisync-20260906.yml").unlink()
          PY
      - name: Validate
        run: node --check web/line_switch.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize multiple remote controllers"
          git push
