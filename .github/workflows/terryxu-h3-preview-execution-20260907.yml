name: TerryXu H3 preview execution fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terryxu-h3-preview-execution-20260907.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make connected H3 previews executable
        shell: python
        run: |
          from pathlib import Path

          # Backend: H3 is an interactive intermediate UI node, and a tiny
          # internal output sink is used only by the frontend execution prompt
          # to keep connected read-only previews in the execution graph.
          path = Path('nodes/h3_prompt_editor.py')
          text = path.read_text(encoding='utf-8')

          if 'has_intermediate_output=True,' not in text:
              anchor = '''            inputs=[\n                io.String.Input("prompt", display_name="H3 原文", multiline=True, default=""),'''
              replacement = '''            has_intermediate_output=True,\n            inputs=[\n                io.String.Input("prompt", display_name="H3 原文", multiline=True, default=""),'''
              if anchor not in text:
                  raise RuntimeError('H3 schema inputs anchor not found')
              text = text.replace(anchor, replacement, 1)

          if 'class H3PreviewSink(io.ComfyNode):' not in text:
              text += '''\n\nclass H3PreviewSink(io.ComfyNode):\n    \"\"\"Internal output sink that keeps connected H3 text previews executable.\"\"\"\n\n    @classmethod\n    def define_schema(cls):\n        return io.Schema(\n            node_id="TerryXuH3PreviewSink",\n            display_name="H3 Preview Sink",\n            category="TerryXu/Internal",\n            description="Internal execution sink used by the H3 read-only preview UI.",\n            is_output_node=True,\n            is_dev_only=True,\n            not_idempotent=True,\n            inputs=[\n                io.String.Input(\n                    "text",\n                    display_name="text",\n                    force_input=True,\n                    socketless=False,\n                ),\n            ],\n            outputs=[],\n        )\n\n    @classmethod\n    def execute(cls, text: str = "") -> io.NodeOutput:\n        return io.NodeOutput()\n'''

          path.write_text(text, encoding='utf-8')

          # Register the internal sink with the extension backend.
          path = Path('nodes/__init__.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from .h3_prompt_editor import H3PromptEditor',
              'from .h3_prompt_editor import H3PreviewSink, H3PromptEditor',
          )
          if '    "H3PreviewSink",' not in text:
              text = text.replace(
                  '    "H3PromptEditor",\n',
                  '    "H3PromptEditor",\n    "H3PreviewSink",\n',
                  1,
              )
          path.write_text(text, encoding='utf-8')

          path = Path('__init__.py')
          text = path.read_text(encoding='utf-8')
          if '    H3PreviewSink,\n' not in text:
              text = text.replace(
                  '    H3PromptEditor,\n',
                  '    H3PromptEditor,\n    H3PreviewSink,\n',
                  1,
              )
          if '            H3PreviewSink,\n' not in text:
              text = text.replace(
                  '            H3PromptEditor,\n',
                  '            H3PromptEditor,\n            H3PreviewSink,\n',
                  1,
              )
          path.write_text(text, encoding='utf-8')

          # Frontend: when source_text is physically connected, inject an
          # ephemeral output sink into the execution prompt. It never appears
          # in the saved workflow or graph UI; it only forces this preview H3
          # and its upstream text producer to participate in execution.
          path = Path('web/h3_text_preview_mode.js')
          text = path.read_text(encoding='utf-8')

          if 'const PREVIEW_SINK_TYPE = "TerryXuH3PreviewSink";' not in text:
              text = text.replace(
                  'const READONLY_CLASS = "terry-h3-readonly-preview";\n',
                  'const READONLY_CLASS = "terry-h3-readonly-preview";\nconst PREVIEW_SINK_TYPE = "TerryXuH3PreviewSink";\nconst PREVIEW_SINK_PREFIX = "__terry_h3_preview_sink__";\n',
                  1,
              )

          if 'function patchPreviewExecution() {' not in text:
              anchor = '''function ensureProperties(node) {\n  node.properties ||= {};\n  return node.properties;\n}\n'''
              block = '''function patchPreviewExecution() {\n  const current = app.graphToPrompt;\n  if (typeof current !== "function" || current.__terryH3PreviewExecution) return;\n\n  const previous = current;\n  const wrapped = async function() {\n    const data = await previous.apply(this, arguments);\n    const output = data?.output;\n    if (!output) return data;\n\n    for (const node of app.graph?._nodes || []) {\n      if (!isTarget(node) || !sourceConnected(node)) continue;\n      const nodeId = String(node.id);\n      if (!output[nodeId]) continue;\n\n      // This node exists only in the execution prompt. It is intentionally not\n      // added to the LiteGraph workflow, so save/load remains unchanged.\n      const sinkId = `${PREVIEW_SINK_PREFIX}${nodeId}`;\n      output[sinkId] = {\n        inputs: { text: [nodeId, 0] },\n        class_type: PREVIEW_SINK_TYPE,\n        _meta: { title: "H3 Preview" },\n      };\n    }\n    return data;\n  };\n  wrapped.__terryH3PreviewExecution = true;\n  app.graphToPrompt = wrapped;\n}\n\n'''
              if anchor not in text:
                  raise RuntimeError('h3_text_preview_mode ensureProperties anchor not found')
              text = text.replace(anchor, anchor + '\n' + block, 1)

          if '  setup() {\n    patchPreviewExecution();\n  },' not in text:
              marker = '''app.registerExtension({\n  name: "TerryXu.H3TextPreviewMode",\n'''
              replacement = '''app.registerExtension({\n  name: "TerryXu.H3TextPreviewMode",\n  setup() {\n    patchPreviewExecution();\n    queueMicrotask(patchPreviewExecution);\n    setTimeout(patchPreviewExecution, 0);\n  },\n'''
              if marker not in text:
                  raise RuntimeError('H3 preview extension marker not found')
              text = text.replace(marker, replacement, 1)

          old_after = '''  afterConfigureGraph() {\n    for (const node of app.graph?._nodes || []) if (isTarget(node)) syncModeSoon(node);\n  },'''
          new_after = '''  afterConfigureGraph() {\n    patchPreviewExecution();\n    for (const node of app.graph?._nodes || []) if (isTarget(node)) syncModeSoon(node);\n  },'''
          if old_after in text:
              text = text.replace(old_after, new_after, 1)
          elif new_after not in text:
              raise RuntimeError('H3 preview afterConfigureGraph anchor not found')

          path.write_text(text, encoding='utf-8')

          # Remove this one-shot workflow from the final repository tree.
          wf = Path('.github/workflows/terryxu-h3-preview-execution-20260907.yml')
          wf.unlink(missing_ok=True)
          for folder in (Path('.github/workflows'), Path('.github')):
              try:
                  folder.rmdir()
              except OSError:
                  pass

      - name: Validate
        shell: bash
        run: |
          python -m py_compile __init__.py nodes/__init__.py nodes/h3_prompt_editor.py
          node --check web/h3_text_preview_mode.js
          python - <<'PY'
          from pathlib import Path
          backend = Path('nodes/h3_prompt_editor.py').read_text(encoding='utf-8')
          frontend = Path('web/h3_text_preview_mode.js').read_text(encoding='utf-8')
          root = Path('__init__.py').read_text(encoding='utf-8')
          assert 'has_intermediate_output=True' in backend
          assert 'class H3PreviewSink(io.ComfyNode)' in backend
          assert 'is_output_node=True' in backend
          assert 'not_idempotent=True' in backend
          assert 'H3PreviewSink' in root
          assert 'function patchPreviewExecution()' in frontend
          assert 'class_type: PREVIEW_SINK_TYPE' in frontend
          assert 'inputs: { text: [nodeId, 0] }' in frontend
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep connected H3 previews in execution graph"
          git push origin main
