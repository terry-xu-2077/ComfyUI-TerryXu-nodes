name: TerryXu switch active route highlight

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terryxu-switch-active-highlight-20260906.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add subtle active-route highlight
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('web/switch_ui.js')
          text = path.read_text(encoding='utf-8')

          if 'function activeEntryIndex(node)' not in text:
              text = text.replace(
                  'function syncNodes2InputLabels(node) {',
                  '''function activeEntryIndex(node) {
            if (isLine(node)) return Math.max(0, numericIndex(node) - 1);
            if (isBool(node)) return boolState(node) ? 1 : 0;
            return -1;
          }

          function syncNodes2InputLabels(node) {''',
                  1,
              )
              text = text.replace(
                  '  const entries = renameEntries(node);\n  rows.forEach((row, index) => {',
                  '  const entries = renameEntries(node);\n  const activeIndex = activeEntryIndex(node);\n  rows.forEach((row, index) => {',
                  1,
              )
              text = text.replace(
                  '    if (entry && span) span.textContent = `${entry.label}   ✎`;\n  });\n}',
                  '    if (entry && span) span.textContent = `${entry.label}   ✎`;\n    row.classList.toggle("terry-switch-active-route", index === activeIndex);\n  });\n}',
                  1,
              )

          if 'function markClassicActiveSlots' not in text:
              marker = 'function syncLineLabels(node) {'
              helper = '''function markClassicActiveSlots(node, entries, activeIndex) {
            entries.forEach((slot, index) => {
              if (!slot) return;
              if (index === activeIndex) {
                slot.color_on = "#d8bd67";
                slot.color_off = "#9f8a4c";
              } else {
                delete slot.color_on;
                delete slot.color_off;
              }
            });
          }
          '''
              text = text.replace(marker, helper + marker, 1)
              text = text.replace(
                  '''function syncLineLabels(node) {
            routes(node).forEach((slot, i) => {
              slot.label = `${routeName(node, slot, i)}   ✎`;
            });
            queueMicrotask(() => syncNodes2InputLabels(node));
          }''',
                  '''function syncLineLabels(node) {
            const slots = routes(node);
            slots.forEach((slot, i) => {
              slot.label = `${routeName(node, slot, i)}   ✎`;
            });
            markClassicActiveSlots(node, slots, activeEntryIndex(node));
            queueMicrotask(() => syncNodes2InputLabels(node));
          }''',
                  1,
              )
              text = text.replace(
                  '''function syncBoolLabels(node) {
            const off = input(node, "input_false");
            const on = input(node, "input_true");
            if (off) off.label = `${boolName(node, false)}   ✎`;
            if (on) on.label = `${boolName(node, true)}   ✎`;
            queueMicrotask(() => syncNodes2InputLabels(node));
          }''',
                  '''function syncBoolLabels(node) {
            const off = input(node, "input_false");
            const on = input(node, "input_true");
            if (off) off.label = `${boolName(node, false)}   ✎`;
            if (on) on.label = `${boolName(node, true)}   ✎`;
            markClassicActiveSlots(node, [off, on], activeEntryIndex(node));
            queueMicrotask(() => syncNodes2InputLabels(node));
          }''',
                  1,
              )

          if 'function installSwitchHighlightStyles()' not in text:
              text = text.replace(
                  'function installNodes2RenameHandler() {',
                  '''function installSwitchHighlightStyles() {
            if (typeof document === "undefined" || document.getElementById("terry-switch-active-route-style")) return;
            const style = document.createElement("style");
            style.id = "terry-switch-active-route-style";
            style.textContent = `
          .lg-slot--input.terry-switch-active-route{
            background:rgba(216,189,103,.075);
            box-shadow:inset 2px 0 0 rgba(216,189,103,.58);
            border-radius:4px;
          }
          .lg-slot--input.terry-switch-active-route .text-node-component-slot-text{
            color:rgba(246,238,207,.96);
          }
          `;
            document.head.append(style);
          }

          function installNodes2RenameHandler() {''',
                  1,
              )

          if 'installSwitchHighlightStyles();' not in text:
              text, n = re.subn(
                  r'(\n\s*setup\(\) \{\n)(\s*)installNodes2RenameHandler\(\);',
                  lambda m: m.group(1) + m.group(2) + 'installSwitchHighlightStyles();\n' + m.group(2) + 'installNodes2RenameHandler();',
                  text,
                  count=1,
              )
              if n != 1:
                  raise RuntimeError('setup hook not found')

          path.write_text(text, encoding='utf-8')

          wf = Path('.github/workflows/terryxu-switch-active-highlight-20260906.yml')
          if wf.exists(): wf.unlink()
          for folder in (Path('.github/workflows'), Path('.github')):
              try: folder.rmdir()
              except OSError: pass
          PY

      - name: Validate
        shell: bash
        run: |
          node --check web/switch_ui.js
          grep -q 'terry-switch-active-route' web/switch_ui.js
          grep -q 'markClassicActiveSlots' web/switch_ui.js
          grep -q 'installSwitchHighlightStyles();' web/switch_ui.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Highlight selected switch routes"
          git push origin main
