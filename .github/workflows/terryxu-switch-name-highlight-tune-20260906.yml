name: TerryXu UI cleanup
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending UI changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Rename line switch display title.
          p = Path('nodes/line_switch.py')
          s = p.read_text(encoding='utf-8').replace('display_name="线路切换器"', 'display_name="多线切换器"')
          p.write_text(s, encoding='utf-8')

          p = Path('web/line_switch.js')
          s = p.read_text(encoding='utf-8').replace('lineTitle: "线路切换器"', 'lineTitle: "多线切换器"').replace('lineTitle: "Line Switch"', 'lineTitle: "Multi-Line Switch"')
          p.write_text(s, encoding='utf-8')

          # 2) Selected wire: remove glow, keep outline width, slightly thicken bright core.
          p = Path('web/switch_wire_highlight.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\n  // Broad soft glow stays in the original type color\.\n  if \(makeLinkPath\(ctx, start, end\)\) \{\n    ctx\.strokeStyle = color;\n    ctx\.globalAlpha = 0\.38;\n    ctx\.lineWidth = width \+ 5\.8;\n    ctx\.shadowColor = color;\n    ctx\.shadowBlur = 14;\n    ctx\.stroke\(\);\n  \}\n', '\n', s, count=1)
          s = s.replace('  ctx.shadowBlur = 0;\n', '', 1)
          s = s.replace('ctx.lineWidth = Math.max(2.0, width - 0.45);', 'ctx.lineWidth = Math.max(2.5, width + 0.15);', 1)
          s = s.replace('// Slimmer inner core: same hue mixed toward white for clear contrast.', '// Brighter inner core, slightly thicker; no glow.')
          p.write_text(s, encoding='utf-8')

          # 3) Narrow H3 @ asset menu to the red-box target width.
          p = Path('web/h3_shared_menus.js')
          s = p.read_text(encoding='utf-8').replace('placeMenu(menu, editor, 360, 520);', 'placeMenu(menu, editor, 255, 520);', 1)
          p.write_text(s, encoding='utf-8')

          Path('.github/workflows/terryxu-switch-name-highlight-tune-20260906.yml').unlink()
          PY
      - name: Validate
        shell: bash
        run: |
          node --check web/line_switch.js
          node --check web/switch_wire_highlight.js
          node --check web/h3_shared_menus.js
          grep -q '多线切换器' nodes/line_switch.py
          grep -q 'placeMenu(menu, editor, 255, 520);' web/h3_shared_menus.js
          ! grep -q 'shadowBlur = 14' web/switch_wire_highlight.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish switch UI and narrow H3 asset menu"
          git push
