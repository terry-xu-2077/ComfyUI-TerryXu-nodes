name: Clean all node display names
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-all-node-display-names.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changes = {
            'nodes/file_save.py': [('TerryXu 文件保存','文件保存')],
            'nodes/date_formatter.py': [('TerryXu 日期格式化','日期格式化')],
            'nodes/video_compare.py': [('TerryXu | 视频对比','视频对比'),('TerryXu 视频对比','视频对比')],
            'nodes/h3_shot_timeline.py': [('TerryXu H3 Prompt Editor (Timeline)','📃 H3 Prompt Editor (Timeline)'),('TerryXu H3 提示词编辑器','📃 H3提示词编辑器')],
            'locales/zh/nodeDefs.json': [('TerryXu 文件保存','文件保存'),('TerryXu 日期格式化','日期格式化'),('TerryXu 视频对比','视频对比'),('TerryXu H3 提示词编辑器（时间轴）','📃 H3提示词编辑器（时间轴）'),('TerryXu H3 提示词编辑器的时间轴模式','H3 提示词编辑器的时间轴模式')],
            'locales/en/nodeDefs.json': [('TerryXu File Save','File Save'),('TerryXu Date Formatter','Date Formatter'),('TerryXu Video Compare','Video Compare'),('TerryXu H3 Prompt Editor (Timeline)','📃 H3 Prompt Editor (Timeline)'),('Timeline mode of TerryXu H3 Prompt Editor','Timeline mode of H3 Prompt Editor')],
          }
          for name, pairs in changes.items():
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              for a,b in pairs:
                  s = s.replace(a,b)
              p.write_text(s,encoding='utf-8')
          p = Path('web/node_title_locale.js')
          if p.exists(): p.unlink()
          Path('.github/workflows/cleanup-all-node-display-names.yml').unlink()
          PY
      - name: Validate
        run: |
          python3 -m py_compile nodes/*.py
          node --check web/group_manager.js
          node --check web/line_switch.js
          node --check web/wire_bus.js
          node --check web/h3_prompt_editor.js
          test ! -e web/node_title_locale.js
          ! grep -R 'display_name=.*TerryXu' nodes locales
          ! grep -R '"display_name": "TerryXu' locales
          grep -Fq '🎛️ 分组开关' web/group_manager.js
          grep -Fq '📃 H3提示词编辑器' locales/zh/nodeDefs.json
          grep -Fq '↔️ 总线-入' locales/zh/nodeDefs.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean all node display name sources"
          git push
