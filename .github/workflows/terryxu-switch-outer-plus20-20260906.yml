name: TerryXu switch outer outline plus20

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terryxu-switch-outer-plus20-20260906.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Increase outer outline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/switch_wire_highlight.js')
          s = p.read_text(encoding='utf-8')
          old = 'ctx.lineWidth = (width + 2.5) * 1.3;'
          new = 'ctx.lineWidth = (width + 2.5) * 1.56;'
          if old not in s:
              raise SystemExit('outer width marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/terryxu-switch-outer-plus20-20260906.yml').unlink()
          PY
      - name: Validate
        shell: bash
        run: |
          node --check web/switch_wire_highlight.js
          grep -q '(width + 2.5) \* 1.56' web/switch_wire_highlight.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Thicken selected wire outer outline"
          git push origin main
