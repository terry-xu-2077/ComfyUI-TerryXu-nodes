name: Sync H3 node title
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-h3-node-title.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync H3 canvas title with search display name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/h3_prompt_editor.js')
          s = p.read_text(encoding='utf-8')

          anchor = 'const MAX_MEDIA = 32;\nfunction isTarget(node) {'
          helper = '''const MAX_MEDIA = 32;\nconst DEFAULT_NODE_TITLE = "📃 H3提示词编辑器";\nconst LEGACY_DEFAULT_NODE_TITLES = new Set([\n  "TerryXu H3 提示词编辑器",\n  "TerryXu | H3 提示词编辑器",\n  "H3 提示词编辑器",\n  "H3提示词编辑器",\n]);\n\nfunction syncDefaultNodeTitle(node, force = false) {\n  if (!node) return;\n  const current = String(node.title || "").trim();\n  if (force || !current || LEGACY_DEFAULT_NODE_TITLES.has(current)) {\n    node.title = DEFAULT_NODE_TITLE;\n  }\n}\n\nfunction isTarget(node) {'''
          if anchor not in s:
              raise SystemExit('MAX_MEDIA anchor not found')
          s = s.replace(anchor, helper, 1)

          old = '''  nodeType.prototype.onNodeCreated = function() {\n    const r = created?.apply(this, arguments);'''
          new = '''  nodeType.prototype.onNodeCreated = function() {\n    const r = created?.apply(this, arguments);\n    syncDefaultNodeTitle(this, true);'''
          if old not in s:
              raise SystemExit('onNodeCreated anchor not found')
          s = s.replace(old, new, 1)

          old = '''  nodeType.prototype.onAdded = function() {\n    const r = added?.apply(this, arguments);\n    ensureLinks(this); ensureSingleMediaInput(this); installEditorSoon(this); return r;\n  };'''
          new = '''  nodeType.prototype.onAdded = function() {\n    const r = added?.apply(this, arguments);\n    syncDefaultNodeTitle(this);\n    ensureLinks(this); ensureSingleMediaInput(this); installEditorSoon(this); return r;\n  };'''
          if old not in s:
              raise SystemExit('onAdded anchor not found')
          s = s.replace(old, new, 1)

          old = '''  nodeType.prototype.onConfigure = function(info) {\n    const r = configure?.apply(this, arguments);\n    ensureLinks(this); normalizeLinks(this); ensureSingleMediaInput(this); installEditorSoon(this); refreshEditorsSoon(); return r;\n  };'''
          new = '''  nodeType.prototype.onConfigure = function(info) {\n    const r = configure?.apply(this, arguments);\n    syncDefaultNodeTitle(this);\n    ensureLinks(this); normalizeLinks(this); ensureSingleMediaInput(this); installEditorSoon(this); refreshEditorsSoon(); return r;\n  };'''
          if old not in s:
              raise SystemExit('onConfigure anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/sync-h3-node-title.yml').unlink()
          PY
      - name: Validate
        run: |
          node --check web/h3_prompt_editor.js
          grep -q 'const DEFAULT_NODE_TITLE = "📃 H3提示词编辑器"' web/h3_prompt_editor.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync H3 canvas node title"
          git push
