name: Fix H3 chip menu blur
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-h3-chip-menu-blur.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove blur-based H3 menu dismissal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/h3_shared_menus.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  const onBlur = () => setTimeout(() => { if (!controller.menu?.matches?.(":hover")) closeMenu(controller); }, 120);\n', '')
          s = s.replace('  editor.addEventListener("beforeinput", onBeforeInput); editor.addEventListener("input", onInput); editor.addEventListener("keydown", onKeyDown); editor.addEventListener("blur", onBlur); editor.addEventListener("pointerdown", onPointer);\n', '  editor.addEventListener("beforeinput", onBeforeInput); editor.addEventListener("input", onInput); editor.addEventListener("keydown", onKeyDown); editor.addEventListener("pointerdown", onPointer);\n')
          s = s.replace('  controller.cleanup = () => { closeMenu(controller); editor.removeEventListener("beforeinput", onBeforeInput); editor.removeEventListener("input", onInput); editor.removeEventListener("keydown", onKeyDown); editor.removeEventListener("blur", onBlur); editor.removeEventListener("pointerdown", onPointer); document.removeEventListener("pointerdown", onDocumentPointer, true); };\n', '  controller.cleanup = () => { closeMenu(controller); editor.removeEventListener("beforeinput", onBeforeInput); editor.removeEventListener("input", onInput); editor.removeEventListener("keydown", onKeyDown); editor.removeEventListener("pointerdown", onPointer); document.removeEventListener("pointerdown", onDocumentPointer, true); };\n')
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/fix-h3-chip-menu-blur.yml').unlink()
          PY
      - name: Validate
        run: |
          node --check web/h3_shared_menus.js
          ! grep -Fq 'const onBlur' web/h3_shared_menus.js
          grep -Fq 'document.addEventListener("pointerdown", onDocumentPointer, true)' web/h3_shared_menus.js
          test ! -e .github/workflows/fix-h3-chip-menu-blur.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix H3 media chip menu opening"
          git push
