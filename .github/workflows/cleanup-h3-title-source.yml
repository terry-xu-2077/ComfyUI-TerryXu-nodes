name: Cleanup H3 title source
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-h3-title-source.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove H3 title patches and keep schema/locale as the only naming source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          p = Path('web/h3_prompt_editor.js')
          s = p.read_text(encoding='utf-8')

          # Remove all H3-specific title constants/migration logic from the frontend.
          s, n = re.subn(
              r'const DEFAULT_NODE_TITLE = "📃 H3提示词编辑器";\n'
              r'const LEGACY_DEFAULT_NODE_TITLES = new Set\(\[.*?\]\);\n\n'
              r'function syncDefaultNodeTitle\(node, force = false\) \{.*?\n\}\n\n',
              '', s, count=1, flags=re.S,
          )
          if n != 1:
              raise SystemExit('H3 title helper block not found exactly once')

          s = s.replace('    syncDefaultNodeTitle(this, true);\n', '')
          s = s.replace('    syncDefaultNodeTitle(this);\n', '')
          if 'syncDefaultNodeTitle' in s or 'DEFAULT_NODE_TITLE' in s or 'LEGACY_DEFAULT_NODE_TITLES' in s:
              raise SystemExit('H3 title patch logic still present in h3_prompt_editor.js')
          p.write_text(s, encoding='utf-8')

          # Remove the standalone title-fix extension entirely.
          Path('web/h3_title_fix.js').unlink(missing_ok=True)

          # Keep normal ComfyUI naming only: backend schema + locale translation.
          py = Path('nodes/h3_prompt_editor.py').read_text(encoding='utf-8')
          if 'display_name="📃 H3提示词编辑器"' not in py:
              raise SystemExit('Canonical H3 backend display_name missing')

          zh_path = Path('locales/zh/nodeDefs.json')
          zh = json.loads(zh_path.read_text(encoding='utf-8'))
          zh['TerryXuH3PromptEditor']['display_name'] = '📃 H3提示词编辑器'
          zh_path.write_text(json.dumps(zh, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          en_path = Path('locales/en/nodeDefs.json')
          en = json.loads(en_path.read_text(encoding='utf-8'))
          en['TerryXuH3PromptEditor']['display_name'] = '📃 H3 Prompt Editor'
          en_path.write_text(json.dumps(en, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # The one-shot workflow removes itself.
          Path('.github/workflows/cleanup-h3-title-source.yml').unlink()
          PY
      - name: Validate
        run: |
          node --check web/h3_prompt_editor.js
          python -m compileall -q __init__.py nodes
          test ! -e web/h3_title_fix.js
          ! grep -q 'syncDefaultNodeTitle\|DEFAULT_NODE_TITLE\|H3TitleFix' web/h3_prompt_editor.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          py = Path('nodes/h3_prompt_editor.py').read_text(encoding='utf-8')
          zh = json.loads(Path('locales/zh/nodeDefs.json').read_text(encoding='utf-8'))
          en = json.loads(Path('locales/en/nodeDefs.json').read_text(encoding='utf-8'))
          assert 'display_name="📃 H3提示词编辑器"' in py
          assert zh['TerryXuH3PromptEditor']['display_name'] == '📃 H3提示词编辑器'
          assert en['TerryXuH3PromptEditor']['display_name'] == '📃 H3 Prompt Editor'
          PY
      - name: Commit
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use standard ComfyUI naming for H3 node"
          git push
