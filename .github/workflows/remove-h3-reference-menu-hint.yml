name: Remove H3 reference menu hint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-h3-reference-menu-hint.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redundant hint text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/h3_shared_menus.js')
          s = p.read_text(encoding='utf-8')
          old = '  title.innerHTML = "<b>引用参考</b><span>仅显示已连接的图片、视频和音频</span>";'
          new = '  title.innerHTML = "<b>引用参考</b>";'
          if old not in s:
              raise SystemExit('target hint text not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/remove-h3-reference-menu-hint.yml').unlink()
          PY
      - name: Validate
        run: |
          node --check web/h3_shared_menus.js
          ! grep -q '仅显示已连接的图片、视频和音频' web/h3_shared_menus.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove redundant H3 reference menu hint"
          git push
