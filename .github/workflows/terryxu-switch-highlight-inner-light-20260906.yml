name: TerryXu tune switch wire highlight

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terryxu-switch-highlight-inner-light-20260906.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch highlight styling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('web/switch_wire_highlight.js')
          t = p.read_text(encoding='utf-8')

          old = '''function drawHighlightedLink(ctx, start, end, color, baseWidth) {
  if (!ctx) return;
  const width = Math.max(2.5, Number(baseWidth) || 3);

  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // Wide soft glow using the line's own type color.
  if (makeLinkPath(ctx, start, end)) {
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.42;
    ctx.lineWidth = width + 5.5;
    ctx.shadowColor = color;
    ctx.shadowBlur = 13;
    ctx.stroke();
  }

  // Visible same-color halo/outline around the core.
  ctx.shadowBlur = 0;
  if (makeLinkPath(ctx, start, end)) {
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.82;
    ctx.lineWidth = width + 2.4;
    ctx.stroke();
  }

  // Keep the original type color, but make the selected route itself thicker.
  if (makeLinkPath(ctx, start, end)) {
    ctx.strokeStyle = color;
    ctx.globalAlpha = 1;
    ctx.lineWidth = width + 0.9;
    ctx.stroke();
  }

  ctx.restore();
}'''

          new = '''function lightenLinkColor(color, whiteMix = 0.48) {
  const raw = String(color || "").trim();
  let r = null, g = null, b = null;
  const hex = raw.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if (hex) {
    const h = hex[1].length === 3
      ? hex[1].split("").map((c) => c + c).join("")
      : hex[1];
    r = parseInt(h.slice(0, 2), 16);
    g = parseInt(h.slice(2, 4), 16);
    b = parseInt(h.slice(4, 6), 16);
  } else {
    const rgb = raw.match(/^rgba?\\(\\s*([0-9.]+)\\s*,\\s*([0-9.]+)\\s*,\\s*([0-9.]+)/i);
    if (rgb) {
      r = Number(rgb[1]);
      g = Number(rgb[2]);
      b = Number(rgb[3]);
    }
  }
  if (![r, g, b].every(Number.isFinite)) return color;
  const mix = Math.max(0, Math.min(1, Number(whiteMix) || 0));
  const blend = (value) => Math.round(value + (255 - value) * mix);
  return `rgb(${blend(r)}, ${blend(g)}, ${blend(b)})`;
}

function drawHighlightedLink(ctx, start, end, color, baseWidth) {
  if (!ctx) return;
  const width = Math.max(2.5, Number(baseWidth) || 3);
  const bright = lightenLinkColor(color, 0.48);

  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // Broad but soft glow in the original type color.
  if (makeLinkPath(ctx, start, end)) {
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.38;
    ctx.lineWidth = width + 5.8;
    ctx.shadowColor = color;
    ctx.shadowBlur = 14;
    ctx.stroke();
  }

  // Original type color becomes the clearly visible outer outline.
  ctx.shadowBlur = 0;
  if (makeLinkPath(ctx, start, end)) {
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.96;
    ctx.lineWidth = width + 2.5;
    ctx.stroke();
  }

  // The core is slimmer and mixed toward white, preserving the original hue.
  if (makeLinkPath(ctx, start, end)) {
    ctx.strokeStyle = bright;
    ctx.globalAlpha = 1;
    ctx.lineWidth = Math.max(2.0, width - 0.45);
    ctx.stroke();
  }

  ctx.restore();
}'''

          if old not in t:
            raise RuntimeError('target highlight block not found')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')

          wf = Path('.github/workflows/terryxu-switch-highlight-inner-light-20260906.yml')
          if wf.exists(): wf.unlink()
          for folder in (Path('.github/workflows'), Path('.github')):
            try: folder.rmdir()
            except OSError: pass
          PY

      - name: Validate
        shell: bash
        run: |
          node --check web/switch_wire_highlight.js
          grep -q 'lightenLinkColor' web/switch_wire_highlight.js
          grep -q 'const bright = lightenLinkColor(color, 0.48)' web/switch_wire_highlight.js
          test ! -e .github/workflows/terryxu-switch-highlight-inner-light-20260906.yml

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine selected switch wire contrast"
          git push origin main
