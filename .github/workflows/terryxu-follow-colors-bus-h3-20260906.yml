name: TerryXu color bus H3 fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terryxu-follow-colors-bus-h3-20260906.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def rep(path, old, new, count=1):
              text = read(path)
              if old not in text:
                  raise RuntimeError(f"anchor not found in {path}: {old[:160]!r}")
              write(path, text.replace(old, new, count))

          # 1) Remote controller follows the controlled node's visible LiteGraph colors.
          line = "web/line_switch.js"
          rep(
              line,
              '''function refreshRemote(node, force = false) {''',
              '''function syncRemoteColor(node, target) {
            if (!isRemote(node)) return false;
            if (!node.__terryRemoteDefaultColors) {
              node.__terryRemoteDefaultColors = {
                color: node.color,
                bgcolor: node.bgcolor,
              };
            }
            const defaults = node.__terryRemoteDefaultColors;
            let changed = false;
            for (const key of ["color", "bgcolor"]) {
              const desired = target?.[key] ?? defaults[key];
              if (desired == null || desired === "") {
                if (node[key] != null && node[key] !== "") {
                  delete node[key];
                  changed = true;
                }
              } else if (node[key] !== desired) {
                node[key] = desired;
                changed = true;
              }
            }
            return changed;
          }

          function refreshRemote(node, force = false) {''',
          )
          rep(
              line,
              '''  const target = targetForChannel(remoteChannel(node));
            const adapter = target && controlAdapters.get(nodeType(target));''',
              '''  const target = targetForChannel(remoteChannel(node));
            syncRemoteColor(node, target);
            const adapter = target && controlAdapters.get(nodeType(target));''',
          )
          rep(
              line,
              '''  let last = 0;
            const tick = (time) => {
              if (time - last > 45) {
                last = time;
                const active = graphNodes().some((node) => isControllable(node) && activeInput(node)?.link != null);
                if (active) app.graph?.setDirtyCanvas?.(true, false);
              }
              requestAnimationFrame(tick);
            };''',
              '''  let last = 0;
            let lastColorSync = 0;
            const tick = (time) => {
              if (time - last > 45) {
                last = time;
                const active = graphNodes().some((node) => isControllable(node) && activeInput(node)?.link != null);
                if (active) app.graph?.setDirtyCanvas?.(true, false);
              }
              if (time - lastColorSync > 180) {
                lastColorSync = time;
                let changed = false;
                for (const remote of graphNodes()) {
                  if (!isRemote(remote)) continue;
                  changed = syncRemoteColor(remote, targetForChannel(remoteChannel(remote))) || changed;
                }
                if (changed) app.graph?.setDirtyCanvas?.(true, true);
              }
              requestAnimationFrame(tick);
            };''',
          )

          # 2) A wired BUS input on Bus-Out takes priority: disable and dim the channel selector.
          bus = "web/wire_bus.js"
          rep(
              bus,
              '''function wirelessChannelWidget(node) {
            return (node?.widgets || []).find((widget) => widget?.terryWirelessChannel === true) || null;
          }

          function wirelessChannelName(node) {''',
              '''function wirelessChannelWidget(node) {
            return (node?.widgets || []).find((widget) => widget?.terryWirelessChannel === true) || null;
          }

          function wirelessUnpackUsesWiredBus(node) {
            return isWirelessUnpack(node) && node?.inputs?.[0]?.link != null;
          }

          function wirelessChannelName(node) {''',
          )
          rep(
              bus,
              '''.terry-wireless-channel-control:focus-within{
            border-color:rgba(255,255,255,.45);
            background:rgba(0,0,0,.28);
          }
          .terry-wireless-channel-control input,''',
              '''.terry-wireless-channel-control:focus-within{
            border-color:rgba(255,255,255,.45);
            background:rgba(0,0,0,.28);
          }
          .terry-wireless-channel-control.is-disabled{
            opacity:.42;
            filter:saturate(.3);
            border-color:rgba(255,255,255,.1);
            background:rgba(0,0,0,.12);
            pointer-events:none;
          }
          .terry-wireless-channel-control.is-disabled::after{
            opacity:.35;
          }
          .terry-wireless-channel-control input,''',
          )
          rep(
              bus,
              '''  control.addEventListener("change", () => {
            setWirelessChannel(node, control.value);''',
              '''  control.addEventListener("change", () => {
            if (!pack && wirelessUnpackUsesWiredBus(node)) return;
            setWirelessChannel(node, control.value);''',
          )
          rep(
              bus,
              '''      const names = wirelessChannelNames(node.graph || app.graph);
                const signature = `${localeCode()}\\u0000${names.join("\\u0000")}`;''',
              '''      const wired = wirelessUnpackUsesWiredBus(node);
                control.disabled = wired;
                root.classList.toggle("is-disabled", wired);

                const names = wirelessChannelNames(node.graph || app.graph);
                const signature = `${localeCode()}\\u0000${names.join("\\u0000")}`;''',
          )
          rep(
              bus,
              '''function syncUnpack(unpack, force = false) {
            localizeFixedPorts(unpack);
            const pack = findPackFromUnpack(unpack);''',
              '''function syncUnpack(unpack, force = false) {
            localizeFixedPorts(unpack);
            if (isWirelessUnpack(unpack)) unpack.__terryWirelessControl?.refresh?.();
            const pack = findPackFromUnpack(unpack);''',
          )

          # 3) H3 references coming from Bus-Out must resolve to the real upstream media node.
          # This fixes both thumbnails and names, and also repairs already-stored virtual links.
          h3 = "web/h3_prompt_editor.js"
          old_normalize = '''function normalizeLinks(node) {
            const graph = node?.graph || app.graph;
            const seen = new Set();
            const out = [];
            for (const link of ensureLinks(node)) {
              const id = Number(link?.source_id);
              const slot = Number(link?.source_slot) || 0;
              if (!Number.isFinite(id) || id === Number(node.id)) continue;
              const src = graph?.getNodeById?.(id);
              if (!src) continue;
              const kind = sourceType(src, slot, link?.source_type);
              const key = `${id}:${slot}`;
              if (seen.has(key)) continue;
              seen.add(key);
              out.push({ source_id: id, source_slot: slot, source_type: String(src.outputs?.[slot]?.type || link?.source_type || "*"), kind });
            }
            node.properties[LINKS_PROP] = out.slice(0, MAX_MEDIA);
            return node.properties[LINKS_PROP];
          }
          '''
          new_normalize = '''function resolveVirtualMediaSource(source, sourceSlot = 0, fallbackType = "") {
            let node = source;
            let slot = Number(sourceSlot) || 0;
            try {
              const resolved = source?.resolveVirtualOutput?.(slot);
              if (resolved?.node) {
                node = resolved.node;
                slot = Number(resolved.slot) || 0;
              }
            } catch {}
            return {
              node,
              slot,
              type: String(node?.outputs?.[slot]?.type || fallbackType || "*"),
            };
          }

          function normalizeLinks(node) {
            const graph = node?.graph || app.graph;
            const seen = new Set();
            const out = [];
            for (const link of ensureLinks(node)) {
              const id = Number(link?.source_id);
              const rawSlot = Number(link?.source_slot) || 0;
              if (!Number.isFinite(id) || id === Number(node.id)) continue;
              const rawSource = graph?.getNodeById?.(id);
              if (!rawSource) continue;
              const resolved = resolveVirtualMediaSource(rawSource, rawSlot, link?.source_type);
              const src = resolved.node;
              const slot = resolved.slot;
              const resolvedId = Number(src?.id);
              if (!src || !Number.isFinite(resolvedId) || resolvedId === Number(node.id)) continue;
              const kind = sourceType(src, slot, resolved.type || link?.source_type);
              const key = `${resolvedId}:${slot}`;
              if (seen.has(key)) continue;
              seen.add(key);
              out.push({
                source_id: resolvedId,
                source_slot: slot,
                source_type: String(resolved.type || src.outputs?.[slot]?.type || link?.source_type || "*"),
                kind,
              });
            }
            node.properties[LINKS_PROP] = out.slice(0, MAX_MEDIA);
            return node.properties[LINKS_PROP];
          }
          '''
          rep(h3, old_normalize, new_normalize)
          rep(
              h3,
              '''function addVirtualLink(node, source, sourceSlot = 0, sourceTypeValue = "") {
            if (!node || !source || Number(source.id) === Number(node.id)) return false;
            const links = normalizeLinks(node);''',
              '''function addVirtualLink(node, source, sourceSlot = 0, sourceTypeValue = "") {
            if (!node || !source) return false;
            const resolved = resolveVirtualMediaSource(source, sourceSlot, sourceTypeValue);
            source = resolved.node;
            sourceSlot = resolved.slot;
            sourceTypeValue = resolved.type;
            if (!source || Number(source.id) === Number(node.id)) return false;
            const links = normalizeLinks(node);''',
          )

          # Self-delete the one-shot workflow from the final tree.
          wf = Path(".github/workflows/terryxu-follow-colors-bus-h3-20260906.yml")
          if wf.exists():
              wf.unlink()
          for folder in (Path(".github/workflows"), Path(".github")):
              try:
                  folder.rmdir()
              except OSError:
                  pass
          PY

      - name: Validate
        shell: bash
        run: |
          for f in web/*.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          line = Path('web/line_switch.js').read_text(encoding='utf-8')
          bus = Path('web/wire_bus.js').read_text(encoding='utf-8')
          h3 = Path('web/h3_prompt_editor.js').read_text(encoding='utf-8')
          assert 'function syncRemoteColor(node, target)' in line
          assert 'lastColorSync' in line
          assert 'function wirelessUnpackUsesWiredBus(node)' in bus
          assert 'control.disabled = wired' in bus
          assert 'is-disabled' in bus
          assert 'function resolveVirtualMediaSource(source' in h3
          assert 'source = resolved.node' in h3
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Follow switch colors and fix bus H3 references"
          git push origin main
