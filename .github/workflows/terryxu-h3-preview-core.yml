name: TerryXu H3 preview core fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terryxu-h3-preview-core.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch H3 preview core
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Use the official V3 PreviewText helper instead of a hand-built UI dict.
          replace_once(
              'nodes/h3_prompt_editor.py',
              '''        return io.NodeOutput(\n            effective_prompt,\n            ui={\n                "terry_h3_assets": result,\n                "text": (effective_prompt,),\n            },\n        )''',
              '''        return io.NodeOutput(\n            effective_prompt,\n            ui=ui.PreviewText(effective_prompt),\n        )'''
          )

          # Put preview consumption in the H3 editor owner itself. This mirrors
          # established PreviewAsText nodes: backend sends ui.text and the node's
          # own onExecuted writes that text into its display widget.
          replace_once(
              'web/h3_prompt_editor.js',
              '''function appendRawEditor(editor, raw) {\n  renderH3RawText(editor, raw);\n}\n\nfunction parsePasted(node, editor, text) {''',
              '''function appendRawEditor(editor, raw) {\n  renderH3RawText(editor, raw);\n}\n\nfunction sourceTextConnected(node) {\n  const input = node?.inputs?.find((slot) => String(slot?.name || "") === "source_text");\n  return Boolean(input && (input.link != null || (Array.isArray(input.links) && input.links.length)));\n}\n\nfunction executedPreviewText(message) {\n  let value = message?.text;\n  while (Array.isArray(value) && value.length === 1) value = value[0];\n  if (Array.isArray(value)) return value.map((item) => String(item ?? "")).join("\\n\\n");\n  if (value == null) return null;\n  return String(value);\n}\n\nfunction applyExecutedTextPreview(node, message) {\n  if (!sourceTextConnected(node)) return false;\n  const text = executedPreviewText(message);\n  if (text == null) return false;\n  node.__terryH3LastPreviewText = text;\n  setRaw(node, text, false);\n  if (node.__terryH3DomWidget && typeof node.__terryH3DomWidget.setValue === "function") {\n    node.__terryH3DomWidget.setValue(text);\n  } else {\n    refreshEditor(node, true);\n  }\n  node.setDirtyCanvas?.(true, true);\n  node.graph?.setDirtyCanvas?.(true, true);\n  return true;\n}\n\nfunction parsePasted(node, editor, text) {'''
          )

          replace_once(
              'web/h3_prompt_editor.js',
              '''  const draw = nodeType.prototype.onDrawForeground;\n  nodeType.prototype.onDrawForeground = function() {\n    const r = draw?.apply(this, arguments);\n    if (!this.__terryH3Editor) installEditorSoon(this);\n    return r;\n  };\n  const serialize = nodeType.prototype.onSerialize;''',
              '''  const draw = nodeType.prototype.onDrawForeground;\n  nodeType.prototype.onDrawForeground = function() {\n    const r = draw?.apply(this, arguments);\n    if (!this.__terryH3Editor) installEditorSoon(this);\n    return r;\n  };\n  const executed = nodeType.prototype.onExecuted;\n  nodeType.prototype.onExecuted = function(message) {\n    const r = executed?.apply(this, arguments);\n    applyExecutedTextPreview(this, message);\n    return r;\n  };\n  const serialize = nodeType.prototype.onSerialize;'''
          )

      - name: Validate and commit
        run: |
          node --check web/h3_prompt_editor.js
          python -m py_compile nodes/h3_prompt_editor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nodes/h3_prompt_editor.py web/h3_prompt_editor.js
          git commit -m "Fix H3 preview using native PreviewText lifecycle"
          git push
