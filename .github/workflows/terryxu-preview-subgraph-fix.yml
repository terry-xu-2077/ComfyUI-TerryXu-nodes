name: TerryXu H3 preview and subgraph bool fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terryxu-preview-subgraph-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        shell: python
        run: |
          from pathlib import Path

          # H3: use the same UI payload shape as ComfyUI's official PreviewText:
          # {"text": (value,)}. Keep H3 asset metadata alongside it.
          p = Path('nodes/h3_prompt_editor.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '"terry_h3_preview_text": effective_prompt,',
              '"text": (effective_prompt,),'
          )
          p.write_text(text, encoding='utf-8')

          # Frontend: consume official PreviewText first, with old key as fallback.
          p = Path('web/h3_text_preview_mode.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'let value = output?.terry_h3_preview_text;',
              'let value = output?.text ?? output?.terry_h3_preview_text;'
          )
          p.write_text(text, encoding='utf-8')

          # Subgraph control: SubgraphInputNode is virtual and may not be returned
          # by getNodeById(), so resolve graph.inputNode directly before climbing
          # through the parent SubgraphNode input.
          p = Path('web/line_switch.js')
          text = p.read_text(encoding='utf-8')
          old = '''  const origin = flexibleNode(graph, originId);\n  if (!origin) return null;\n\n  if (subgraphInputOrigin(graph, origin)) {'''
          new = '''  const boundaryOrigin = graph?.inputNode && String(originId) === String(graph.inputNode.id)\n    ? graph.inputNode\n    : null;\n  const origin = boundaryOrigin || flexibleNode(graph, originId);\n  if (!origin) return null;\n\n  if (subgraphInputOrigin(graph, origin)) {'''
          text = text.replace(old, new)
          text = text.replace(
              'const nodeId = detail.node ?? detail.node_id;',
              'const nodeId = detail.display_node ?? detail.node ?? detail.node_id;'
          )
          p.write_text(text, encoding='utf-8')

          print('patched')
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nodes/h3_prompt_editor.py web/h3_text_preview_mode.js web/line_switch.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use official text preview payload and fix subgraph bool tracing"
            git push
          fi
