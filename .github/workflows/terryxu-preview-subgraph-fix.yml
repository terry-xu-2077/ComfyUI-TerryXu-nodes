name: TerryXu H3 preview and subgraph bool fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terryxu-preview-subgraph-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'nodes/h3_prompt_editor.py',
              '''        return io.NodeOutput(\n            effective_prompt,\n            ui={\n                "terry_h3_assets": result,\n                "terry_h3_preview_text": effective_prompt,\n            },\n        )\n''',
              '''        # Match ComfyUI's official text preview transport. PreviewText\n        # serializes the UI payload as {"text": (value,)}, which means the\n        # normal executed/onExecuted cache lifecycle can restore it reliably.\n        preview_ui = ui.PreviewText(effective_prompt).as_dict()\n        preview_ui["terry_h3_assets"] = result\n        return io.NodeOutput(\n            effective_prompt,\n            ui=preview_ui,\n        )\n'''
          )

          replace_once(
              'web/h3_text_preview_mode.js',
              '  let value = output?.terry_h3_preview_text;\n',
              '  let value = output?.text ?? output?.terry_h3_preview_text;\n'
          )

          replace_once(
              'web/line_switch.js',
              '''  const origin = flexibleNode(graph, originId);\n  if (!origin) return null;\n\n  if (subgraphInputOrigin(graph, origin)) {\n''',
              '''  // SubgraphInputNode is a virtual IO node and is not guaranteed to be\n  // returned by graph.getNodeById(). Resolve the sentinel input node directly\n  // before normal node lookup so promoted/exposed controls can be traced out to\n  // the parent SubgraphNode input.\n  const boundaryOrigin = graph?.inputNode && String(originId) === String(graph.inputNode.id)\n    ? graph.inputNode\n    : null;\n  const origin = boundaryOrigin || flexibleNode(graph, originId);\n  if (!origin) return null;\n\n  if (subgraphInputOrigin(graph, origin)) {\n'''
          )

          replace_once(
              'web/line_switch.js',
              '    const nodeId = detail.node ?? detail.node_id;\n',
              '    const nodeId = detail.display_node ?? detail.node ?? detail.node_id;\n'
          )
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nodes/h3_prompt_editor.py web/h3_text_preview_mode.js web/line_switch.js
          git commit -m "Use official text preview transport and fix subgraph bool tracing"
          git push
