name: Use H3 at-menu for media chips
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/use-at-menu-for-media-chip.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch shared asset menu
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          p = Path('web/h3_shared_menus.js')
          s = p.read_text(encoding='utf-8')
          if old not in s: raise SystemExit('shared asset-menu source mismatch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          q = Path('web/h3_transport_and_rebind.js')
          t = q.read_text(encoding='utf-8')
          app_import = 'import { app } from "../../scripts/app.js";\n'
          shared_import = 'import { openH3AssetMenuForChip } from "./h3_shared_menus.js";\n'
          if shared_import not in t:
              if app_import not in t: raise SystemExit('app import missing')
              t = t.replace(app_import, app_import + shared_import, 1)
          oh = base64.b64decode('ICAgIGV2ZW50LnByZXZlbnREZWZhdWx0KCk7CiAgICBldmVudC5zdG9wUHJvcGFnYXRpb24oKTsKICAgIGV2ZW50LnN0b3BJbW1lZGlhdGVQcm9wYWdhdGlvbj8uKCk7CiAgICBvcGVuUGlja2VyKG5vZGUsIGNoaXAsIGluZm8pOwo=').decode()
          nh = base64.b64decode('').decode()
          if oh not in t: raise SystemExit('media click handler mismatch')
          q.write_text(t.replace(oh, nh, 1), encoding='utf-8')
          Path('.github/workflows/use-at-menu-for-media-chip.yml').unlink()
          PY
      - name: Validate and commit
        run: |
          node --check web/h3_shared_menus.js
          node --check web/h3_transport_and_rebind.js
          grep -Fq 'export function openH3AssetMenuForChip' web/h3_shared_menus.js
          grep -Fq 'openH3AssetMenuForChip(editor, chip)' web/h3_transport_and_rebind.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reuse @ menu for H3 media chip switching"
          git push
