name: Use @ menu for H3 media chips
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/use-at-menu-for-media-chip.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse shared @ asset menu for media-chip replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          shared = Path('web/h3_shared_menus.js')
          s = shared.read_text(encoding='utf-8')

          old = '''function openAssetMenu(controller) {
  const { node, editor, mode } = controller;
  const hit = caretRange(editor, "@");
  if (!hit) { closeMenu(controller); return false; }
  closeMenu(controller);

  const allAssets = assets(node, mode);
  const visible = allAssets.filter((asset) =>
    !hit.query || `${asset.name} ${asset.label} ${asset.displayLabel} ${asset.kind}`.toLowerCase().includes(hit.query)
  );

  const menu = document.createElement("div");
  menu.className = "terry-h3-role-menu terry-h3-shared-module-menu";
  controller.menu = menu;
  controller.menuType = "asset";
  document.body.append(menu);

  const legend = document.createElement("div");
  legend.className = "terry-h3-role-legend";
  const title = document.createElement("div");
  title.className = "terry-h3-role-title";
  title.innerHTML = "<b>引用参考</b>";
  legend.append(title);
  menu.append(legend);

  for (const asset of visible) {
    menu.append(makeAssetRow(asset, asset.displayLabel, () => insertMediaReference(controller, hit, asset)));
  }
  if (!visible.length) {
    const empty = document.createElement("div");
    empty.className = "terry-h3-role-empty";
    empty.textContent = allAssets.length ? "没有匹配的参考资产。" : "还没有连接图片、视频或音频参考。";
    menu.append(empty);
  }
  placeMenu(menu, editor, 295, 520);
  return true;
}
'''
          new = '''function buildAssetMenu(controller, query = "", onSelect = null) {
  const { node, mode } = controller;
  const allAssets = assets(node, mode);
  const visible = allAssets.filter((asset) =>
    !query || `${asset.name} ${asset.label} ${asset.displayLabel} ${asset.kind}`.toLowerCase().includes(query)
  );

  const menu = document.createElement("div");
  menu.className = "terry-h3-role-menu terry-h3-shared-module-menu";
  controller.menu = menu;
  controller.menuType = "asset";
  document.body.append(menu);

  const legend = document.createElement("div");
  legend.className = "terry-h3-role-legend";
  const title = document.createElement("div");
  title.className = "terry-h3-role-title";
  title.innerHTML = "<b>引用参考</b>";
  legend.append(title);
  menu.append(legend);

  for (const asset of visible) {
    menu.append(makeAssetRow(asset, asset.displayLabel, () => onSelect?.(asset)));
  }
  if (!visible.length) {
    const empty = document.createElement("div");
    empty.className = "terry-h3-role-empty";
    empty.textContent = allAssets.length ? "没有匹配的参考资产。" : "还没有连接图片、视频或音频参考。";
    menu.append(empty);
  }
  return menu;
}

function placeAssetMenuAtElement(menu, anchor) {
  const rect = anchor?.getBoundingClientRect?.();
  if (!rect) { placeMenu(menu, anchor || document.body, 295, 520); return; }
  const width = 295;
  const measuredHeight = Math.min(520, menu.offsetHeight || 400);
  let left = rect.left, top = rect.bottom + 6;
  if (left + width > window.innerWidth - 8) left = window.innerWidth - width - 8;
  if (top + measuredHeight > window.innerHeight - 8) top = Math.max(8, rect.top - measuredHeight - 6);
  Object.assign(menu.style, { position: "fixed", left: `${Math.max(8, Math.round(left))}px`, top: `${Math.max(8, Math.round(top))}px`, zIndex: "2147483000", isolation: "isolate", pointerEvents: "auto" });
}

function openAssetMenu(controller) {
  const { editor } = controller;
  const hit = caretRange(editor, "@");
  if (!hit) { closeMenu(controller); return false; }
  closeMenu(controller);
  const menu = buildAssetMenu(controller, hit.query, (asset) => insertMediaReference(controller, hit, asset));
  placeMenu(menu, editor, 295, 520);
  return true;
}

export function openH3AssetMenuForChip(editor, chip) {
  const controller = controllers.get(editor);
  if (!controller || !chip || !editor?.contains?.(chip)) return false;
  closeMenu(controller);
  const menu = buildAssetMenu(controller, "", (asset) => {
    const token = createToken(controller, asset.raw, asset);
    chip.replaceWith(token);
    controller.onChange?.();
    editor.dispatchEvent(new Event("terrychange", { bubbles: true }));
    editor.focus({ preventScroll: true });
    closeMenu(controller);
  });
  placeAssetMenuAtElement(menu, chip);
  return true;
}
'''
          if old not in s:
              raise SystemExit('openAssetMenu block did not match expected source')
          s = s.replace(old, new, 1)
          shared.write_text(s, encoding='utf-8')

          transport = Path('web/h3_transport_and_rebind.js')
          t = transport.read_text(encoding='utf-8')
          import_line = 'import { app } from "../../scripts/app.js";\n'
          if import_line not in t:
              raise SystemExit('transport app import missing')
          t = t.replace(import_line, import_line + 'import { openH3AssetMenuForChip } from "./h3_shared_menus.js";\n', 1)

          old_handler = '''    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation?.();
    openPicker(node, chip, info);
'''
          new_handler = '''    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation?.();
    if (info.type === "picture" || info.type === "video" || info.type === "audio") {
      closePicker(node);
      openH3AssetMenuForChip(editor, chip);
      return;
    }
    openPicker(node, chip, info);
'''
          if old_handler not in t:
              raise SystemExit('transport click handler did not match expected source')
          t = t.replace(old_handler, new_handler, 1)
          transport.write_text(t, encoding='utf-8')

          Path('.github/workflows/use-at-menu-for-media-chip.yml').unlink()
          PY
      - name: Validate
        run: |
          node --check web/h3_shared_menus.js
          node --check web/h3_transport_and_rebind.js
          grep -Fq 'export function openH3AssetMenuForChip' web/h3_shared_menus.js
          grep -Fq 'openH3AssetMenuForChip(editor, chip)' web/h3_transport_and_rebind.js
          test ! -e .github/workflows/use-at-menu-for-media-chip.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reuse @ menu for H3 media chip switching"
          git push
