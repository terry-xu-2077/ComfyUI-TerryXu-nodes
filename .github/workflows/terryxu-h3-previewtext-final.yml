name: TerryXu H3 PreviewText finalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terryxu-h3-previewtext-final.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch PreviewText consumer
        shell: python
        run: |
          from pathlib import Path
          p = Path('web/h3_text_preview_mode.js')
          text = p.read_text(encoding='utf-8')
          old = '''  const candidates = [\n    output?.terry_h3_preview_text,\n    output?.output?.terry_h3_preview_text,\n    output?.ui?.terry_h3_preview_text,\n  ];'''
          new = '''  const candidates = [\n    // ComfyUI official PreviewText payload first. Fresh execution, cache replay\n    // and subgraph display paths all use the standard `text` UI field.\n    output?.text,\n    output?.output?.text,\n    output?.ui?.text,\n    // Legacy fallback for workflows produced by earlier TerryXu builds.\n    output?.terry_h3_preview_text,\n    output?.output?.terry_h3_preview_text,\n    output?.ui?.terry_h3_preview_text,\n  ];'''
          if old not in text:
              raise SystemExit('Preview candidate block not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/h3_text_preview_mode.js
          git commit -m "Consume ComfyUI PreviewText payload in H3 preview mode"
          git push
