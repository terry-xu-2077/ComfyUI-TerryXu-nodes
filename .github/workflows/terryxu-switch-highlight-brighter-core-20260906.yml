name: TerryXu brighter switch highlight core

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terryxu-switch-highlight-brighter-core-20260906.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Brighten selected switch wire core
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/switch_wire_highlight.js')
          t = p.read_text(encoding='utf-8')
          old = 'const bright = lightenLinkColor(color, 0.48);'
          new = 'const bright = lightenLinkColor(color, 0.76);'
          if old not in t:
              raise RuntimeError('highlight mix marker not found')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          wf = Path('.github/workflows/terryxu-switch-highlight-brighter-core-20260906.yml')
          if wf.exists(): wf.unlink()
          for folder in (Path('.github/workflows'), Path('.github')):
              try: folder.rmdir()
              except OSError: pass
          PY

      - name: Validate
        shell: bash
        run: |
          node --check web/switch_wire_highlight.js
          grep -q 'lightenLinkColor(color, 0.76)' web/switch_wire_highlight.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Brighten selected switch wire core"
          git push origin main
