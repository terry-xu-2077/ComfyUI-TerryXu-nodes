name: TerryXu subgraph boolean boundary fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terryxu-fix-subgraph-bool-boundary.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch line switch subgraph boundary resolution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/line_switch.js')
          text = path.read_text(encoding='utf-8')

          old = '''  const originId = link.origin_id ?? link.originId;
          const originSlot = Number(link.origin_slot ?? link.originSlot ?? 0) || 0;
          const origin = flexibleNode(graph, originId);
          if (!origin) return null;

          if (subgraphInputOrigin(graph, origin)) {'''
          new = '''  const originId = link.origin_id ?? link.originId;
          const originSlot = Number(link.origin_slot ?? link.originSlot ?? 0) || 0;
          const isSubgraphBoundary = Boolean(
            graph?.inputNode && String(originId) === String(graph.inputNode.id)
          );
          const origin = isSubgraphBoundary ? graph.inputNode : flexibleNode(graph, originId);
          if (!origin) return null;

          if (isSubgraphBoundary || subgraphInputOrigin(graph, origin)) {'''
          if old not in text:
              raise SystemExit('subgraph boundary block not found')
          text = text.replace(old, new, 1)

          old = '''    const nodeId = detail.node ?? detail.node_id;
              const output = detail.output || detail;
              const node = executionNodeById(nodeId);
              if (!node) return;'''
          new = '''    const output = detail.output || detail;
              const node = executionNodeById(detail.node ?? detail.node_id)
                || executionNodeById(detail.display_node);
              if (!node) return;'''
          if old not in text:
              raise SystemExit('executed listener block not found')
          text = text.replace(old, new, 1)

          old = '''    const value = Boolean(live);
              const widget = boolWidget(node);
              if (widget) widget.value = value;
              node.__terryRuntimeBool = value;
              return value;'''
          new = '''    const value = Boolean(live);
              const widget = boolWidget(node);
              if (widget) widget.value = value;
              node.__terryRuntimeBool = value;
              properties(node)[BOOL_PROPERTY] = value;
              return value;'''
          if old not in text:
              raise SystemExit('selectedBool live-value block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/terryxu-fix-subgraph-bool-boundary.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/line_switch.js .github/workflows/terryxu-fix-subgraph-bool-boundary.yml
          git commit -m "Resolve boolean controls through subgraph input boundaries"
          git push
