name: Temporary Comfy Registry diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/registry-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect-registry:
    if: ${{ github.repository == 'terry-xu-2077/ComfyUI-TerryXu-nodes' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check Manager node-list visibility
        shell: bash
        run: |
          python - <<'PY'
          import requests
          base = "https://api.comfy.org/nodes"
          target = "comfyui-terryxu-nodes"
          cases = [
              ("unfiltered", {}),
              ("manager-windows", {"page": 1, "limit": 30, "comfyui_version": "unknown", "form_factor": "git-windows"}),
              ("manager-linux", {"page": 1, "limit": 30, "comfyui_version": "unknown", "form_factor": "git-linux"}),
          ]
          for label, params in cases:
              try:
                  response = requests.get(base, params=params, timeout=30)
                  print(f"\\n===== {label}: HTTP {response.status_code} {response.url} =====")
                  data = response.json()
                  print("totalPages:", data.get("totalPages"), "total:", data.get("total"))
                  found = [node for node in data.get("nodes", []) if node.get("id") == target]
                  print("target_matches:", found)
              except Exception as exc:
                  print(label, "ERROR:", repr(exc))
          PY
      - name: Query public Registry records
        shell: bash
        run: |
          set +e
          for url in \
            "https://api.comfy.org/nodes/comfyui-terryxu-nodes" \
            "https://api.comfy.org/nodes/comfyui-terryxu-nodes/versions?include_status_reason=true" \
            "https://api.comfy.org/nodes/comfyui-terryxu-nodes/install?version=1.0.1"
          do
            echo
            echo "===== $url ====="
            curl --silent --show-error --location --max-time 30 \
              --write-out "\\nHTTP_STATUS:%{http_code}\\n" "$url"
          done
