name: TerryXu remote target live sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terryxu-remote-target-live-sync-20260906.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch direct target widget synchronization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/line_switch.js')
          s = p.read_text(encoding='utf-8')

          anchor = '''function refreshBool(node) {\n'''
          helper = '''function bindTargetWidgetSync(node, widget, kind) {\n  if (!node || !widget || widget.__terryRemoteTargetSyncWrapped) return;\n  const original = widget.callback;\n  widget.callback = function (value) {\n    const result = original?.apply(this, arguments);\n    if (kind === "line") {\n      const next = clampIndex(value, routeValues(node).length);\n      properties(node)[INDEX_PROPERTY] = next;\n      node.__terryRuntimeIndex = next;\n    } else if (kind === "bool") {\n      const next = Boolean(value);\n      properties(node)[BOOL_PROPERTY] = next;\n      node.__terryRuntimeBool = next;\n    }\n    // Nodes 2.0 can update a widget without going through node.onWidgetChanged.\n    // Treat the target widget callback as the direct-change event and refresh\n    // every remote from the target, which remains the single source of truth.\n    queueMicrotask(() => {\n      globalThis.__terrySyncSwitchUI?.(node);\n      refreshAllRemotes();\n      node.graph?.setDirtyCanvas?.(true, true);\n    });\n    return result;\n  };\n  widget.__terryRemoteTargetSyncWrapped = true;\n}\n\n'''
          if anchor not in s:
              raise SystemExit('refreshBool anchor not found')
          s = s.replace(anchor, helper + anchor, 1)

          old_line = '''  const widget = indexWidget(node);\n  if (widget) {\n    const values = routeValues(node);\n'''
          new_line = '''  const widget = indexWidget(node);\n  if (widget) {\n    bindTargetWidgetSync(node, widget, "line");\n    const values = routeValues(node);\n'''
          if old_line not in s:
              raise SystemExit('line widget block not found')
          s = s.replace(old_line, new_line, 1)

          old_bool = '''  const widget = boolWidget(node);\n  if (widget) widget.label = labels.bool;\n'''
          new_bool = '''  const widget = boolWidget(node);\n  if (widget) {\n    bindTargetWidgetSync(node, widget, "bool");\n    widget.label = labels.bool;\n  }\n'''
          if old_bool not in s:
              raise SystemExit('bool widget block not found')
          s = s.replace(old_bool, new_bool, 1)

          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/terryxu-remote-target-live-sync-20260906.yml').unlink()
          PY
      - name: Validate
        shell: bash
        run: |
          node --check web/line_switch.js
          grep -q 'function bindTargetWidgetSync' web/line_switch.js
          grep -q 'bindTargetWidgetSync(node, widget, "line")' web/line_switch.js
          grep -q 'bindTargetWidgetSync(node, widget, "bool")' web/line_switch.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync remotes after direct target changes"
          git push origin main
