name: Temporary Registry status check

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/registry-status.yml

permissions:
  contents: read

jobs:
  registry-status:
    runs-on: ubuntu-latest
    steps:
      - name: Query exact node version status
        shell: bash
        run: |
          set -e
          echo '===== VERSION STATUS ====='
          curl --silent --show-error --fail --location --max-time 30 'https://api.comfy.org/nodes/comfyui-terryxu-nodes/versions?include_status_reason=true'
          echo
          echo '===== REGISTRY SEARCH ====='
          curl --silent --show-error --fail --location --max-time 30 'https://api.comfy.org/nodes?search=comfyui-terryxu-nodes&page=1&limit=10'
          echo