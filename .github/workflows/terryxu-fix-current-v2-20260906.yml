name: TerryXu one-shot current fixes v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terryxu-fix-current-v2-20260906.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def rep(path, old, new, count=1):
              text = read(path)
              if old not in text:
                  raise RuntimeError(f"anchor not found in {path}: {old[:140]!r}")
              write(path, text.replace(old, new, count))

          def sub(path, pattern, replacement, flags=0):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f"regex count={count} in {path}: {pattern}")
              write(path, updated)

          # 1. Disable H3 timeline registration, keep its implementation files for now.
          for path in ("__init__.py", "nodes/__init__.py"):
              text = read(path)
              text = re.sub(r"(?m)^\s*from \.h3_shot_timeline import H3ShotTimeline\s*\n", "", text)
              text = re.sub(r"(?m)^\s*H3ShotTimeline,\s*\n", "", text)
              write(path, text)

          # 2. H3 @ menu: only connected media assets.
          simple_menu = '''function openAssetMenu(controller) {
            const { node, editor, mode } = controller;
            const hit = caretRange(editor, "@");
            if (!hit) { closeMenu(controller); return false; }
            closeMenu(controller);

            const allAssets = assets(node, mode);
            const visible = allAssets.filter((asset) =>
              !hit.query || `${asset.name} ${asset.label} ${asset.displayLabel} ${asset.kind}`.toLowerCase().includes(hit.query)
            );

            const menu = document.createElement("div");
            menu.className = "terry-h3-role-menu terry-h3-shared-module-menu";
            controller.menu = menu;
            controller.menuType = "asset";
            document.body.append(menu);

            const legend = document.createElement("div");
            legend.className = "terry-h3-role-legend";
            const title = document.createElement("div");
            title.className = "terry-h3-role-title";
            title.innerHTML = "<b>引用参考</b><span>仅显示已连接的图片、视频和音频</span>";
            legend.append(title);
            menu.append(legend);

            for (const asset of visible) {
              menu.append(makeAssetRow(asset, asset.displayLabel, () => insertMediaReference(controller, hit, asset)));
            }
            if (!visible.length) {
              const empty = document.createElement("div");
              empty.className = "terry-h3-role-empty";
              empty.textContent = allAssets.length ? "没有匹配的参考资产。" : "还没有连接图片、视频或音频参考。";
              menu.append(empty);
            }
            placeMenu(menu, editor, 430, 520);
            return true;
          }'''
          sub(
              "web/h3_shared_menus.js",
              r"function openAssetMenu\(controller\) \{.*?\n\}\n\nfunction nextSpeaker",
              simple_menu + "\n\nfunction nextSpeaker",
              re.S,
          )

          # 3. Merge wired and wireless bus into the wireless node pair.
          replacements = [
              ('wirelessPackTitle: "⛓️‍💥总线-入",', 'wirelessPackTitle: "总线-入",'),
              ('wirelessUnpackTitle: "⛓️‍💥总线-出",', 'wirelessUnpackTitle: "总线-出",'),
              ('wirelessPackDescription: "将多路连接发布到独立的 TerryXu 无线总线频道，不与 KJNodes Get/Set 混用。",', 'wirelessPackDescription: "汇总多路连接；既可从总线端口有线连出，也可通过 TerryXu 频道无线发布。",'),
              ('wirelessUnpackDescription: "选择 TerryXu 无线总线频道，自动恢复对应的多路连接。",', 'wirelessUnpackDescription: "既可从总线端口有线接收，也可选择 TerryXu 频道无线接收，并自动恢复多路连接。",'),
              ('wirelessPackTitle: "⛓️‍💥 Bus-In",', 'wirelessPackTitle: "Bus-In",'),
              ('wirelessUnpackTitle: "⛓️‍💥 Bus-Out",', 'wirelessUnpackTitle: "Bus-Out",'),
              ('wirelessPackDescription: "Publish multiple connections to an independent TerryXu wireless bus channel.",', 'wirelessPackDescription: "Bundle multiple connections and expose them through both a wired BUS output and a TerryXu wireless channel.",'),
              ('wirelessUnpackDescription: "Select a TerryXu wireless bus channel and restore all of its connections.",', 'wirelessUnpackDescription: "Restore a bus from either the wired BUS input or a TerryXu wireless channel.",'),
          ]
          for old, new in replacements:
              rep("web/wire_bus.js", old, new)

          find_pack = '''function findPackFromUnpack(unpack) {
            if (isWirelessUnpack(unpack)) {
              const linkId = unpack?.inputs?.[0]?.link;
              if (unpack?.graph && linkId != null) {
                const upstream = resolveUpstream(unpack.graph, linkId);
                if (upstream && isWirelessPack(upstream.node)) return upstream.node;
              }
              const name = wirelessChannelName(unpack);
              if (!name) return null;
              return wirelessPacksInScope(unpack.graph || app.graph)
                .find((node) => wirelessChannelName(node) === name) || null;
            }
            if (!isWiredUnpack(unpack)) return null;
            const linkId = unpack?.inputs?.[0]?.link;
            if (!unpack?.graph || linkId == null) return null;
            const upstream = resolveUpstream(unpack.graph, linkId);
            return upstream && isWiredPack(upstream.node) ? upstream.node : null;
          }'''
          sub("web/wire_bus.js", r"function findPackFromUnpack\(unpack\) \{.*?\n\}\n\nfunction nodeProperties", find_pack + "\n\nfunction nodeProperties", re.S)

          localize = '''function localizeFixedPorts(node, updateTitle = false) {
            const text = labels();
            if (isWiredPack(node)) {
              const out = node.outputs?.[0];
              if (out) { out.name = "bus"; out.label = text.bus; out.type = BUS_TYPE; }
              if (updateTitle) node.title = text.packTitle;
            } else if (isWiredUnpack(node)) {
              const input = node.inputs?.[0];
              if (input) { input.name = "bus"; input.label = text.bus; input.type = BUS_TYPE; }
              if (updateTitle) node.title = text.unpackTitle;
            } else if (isWirelessPack(node)) {
              const out = node.outputs?.[0];
              if (out) { out.name = "bus"; out.label = text.bus; out.type = BUS_TYPE; }
              const widget = wirelessChannelWidget(node);
              if (widget) widget.name = text.channelName;
              if (updateTitle) node.title = text.wirelessPackTitle;
            } else if (isWirelessUnpack(node)) {
              const input = node.inputs?.[0];
              if (input) { input.name = "bus"; input.label = text.bus; input.type = BUS_TYPE; }
              const widget = wirelessChannelWidget(node);
              if (widget) widget.name = text.channelSelect;
              if (updateTitle) node.title = text.wirelessUnpackTitle;
            }
          }'''
          sub("web/wire_bus.js", r"function localizeFixedPorts\(node, updateTitle = false\) \{.*?\n\}\n\nfunction emptyLaneLabel", localize + "\n\nfunction emptyLaneLabel", re.S)

          defs = '''  addCustomNodeDefs(defs) {
            const text = labels();
            defs[WIRELESS_PACK_TYPE] = makeNodeDef(
              WIRELESS_PACK_TYPE,
              text.wirelessPackTitle,
              text.wirelessPackDescription,
              text.category,
              { required: { wire: [EMPTY_TYPE, { label: text.addWire }] } },
              [BUS_TYPE],
              [text.bus]
            );
            defs[WIRELESS_UNPACK_TYPE] = makeNodeDef(
              WIRELESS_UNPACK_TYPE,
              text.wirelessUnpackTitle,
              text.wirelessUnpackDescription,
              text.category,
              { required: { bus: [BUS_TYPE, { label: text.bus }] } },
              [],
              []
            );
          },'''
          sub("web/wire_bus.js", r"  addCustomNodeDefs\(defs\) \{.*?\n  \},\n\n  beforeRegisterNodeDef", defs + "\n\n  beforeRegisterNodeDef", re.S)

          rep("web/wire_bus.js", '} else if (!isWirelessDef && type === LiteGraph.INPUT && index === 0) {', '} else if (type === LiteGraph.INPUT && index === 0) {')

          connect_block = '''    if (isPackDef) {
              nodeType.prototype.__terryBusLaneEntries = function () {
                return effectivePackLaneEntries(this);
              };
              nodeType.prototype.onConnectInput = function (slot, type) {
                return slot >= 0 && type !== BUS_TYPE;
              };
              nodeType.prototype.onConnectOutput = function (slot, type, input, targetNode) {
                return slot === 0 && (
                  isWirelessUnpack(targetNode)
                  || isReroute(targetNode)
                  || isSet(targetNode)
                );
              };
            } else {
              nodeType.prototype.onConnectInput = function (slot, type, output, originNode) {
                return slot === 0 && (
                  type === BUS_TYPE
                  || isWirelessPack(originNode)
                  || isReroute(originNode)
                  || isGet(originNode)
                );
              };
            }

          '''
          sub(
              "web/wire_bus.js",
              r"    if \(isPackDef\) \{\n      nodeType\.prototype\.__terryBusLaneEntries = function \(\) \{.*?\n    \}\n\n    const originalConfigure",
              connect_block + "    const originalConfigure",
              re.S,
          )

          # Merged BUS port visuals.
          rep("web/wire_bus_visual.js", 'return type === BUS_TYPE || nodeType(origin) === PACK_TYPE;', 'return type === BUS_TYPE || nodeType(origin) === PACK_TYPE || nodeType(origin) === WIRELESS_PACK_TYPE;')
          rep("web/wire_bus_visual.js", 'if (nodeType(node) === PACK_TYPE) return { node, graph };', 'if (nodeType(node) === PACK_TYPE || nodeType(node) === WIRELESS_PACK_TYPE) return { node, graph };')

          # Only patch the wireless PACK branch, not the legacy wired PACK branch.
          sub(
              "web/wire_bus_visual.js",
              r"(if \(type === WIRELESS_PACK_TYPE\) \{\n)\s*phantomOutputRows\.push\(`\$\{expandedRoot\} \.lg-slot--output`\);",
              r'''\1        packRows.push(`${expandedRoot} .lg-slot--output`);
                  packs.push(`${expandedRoot} .lg-slot--output [data-testid="slot-connection-dot"]`);''',
          )
          rep(
              "web/wire_bus_visual.js",
              '      } else if (type === WIRELESS_UNPACK_TYPE) {\n        for (let slot = 0; slot < (node.outputs?.length || 0); slot++) {',
              '      } else if (type === WIRELESS_UNPACK_TYPE) {\n        unpackRows.push(`${expandedRoot} .lg-slot--input`);\n        unpacks.push(`${expandedRoot} .lg-slot--input [data-testid="slot-connection-dot"]`);\n        for (let slot = 0; slot < (node.outputs?.length || 0); slot++) {',
          )
          rep(
              "web/wire_bus_visual.js",
              '      (nodeType(this) === UNPACK_TYPE && Number(slot) === 0)\n      || (nodeType(this) === WIRELESS_PACK_TYPE && this.inputs?.length === 1 && this.inputs?.[slot]?.type === BUS_TYPE)',
              '      ((nodeType(this) === UNPACK_TYPE || nodeType(this) === WIRELESS_UNPACK_TYPE) && Number(slot) === 0)',
          )
          rep(
              "web/wire_bus_visual.js",
              '      (nodeType(this) === PACK_TYPE && Number(slot) === 0)\n      || (nodeType(this) === WIRELESS_UNPACK_TYPE && this.outputs?.length === 1 && this.outputs?.[slot]?.type === BUS_TYPE)',
              '      ((nodeType(this) === PACK_TYPE || nodeType(this) === WIRELESS_PACK_TYPE) && Number(slot) === 0)',
          )
          foreground = '''      if (nodeType(this) === PACK_TYPE || nodeType(this) === WIRELESS_PACK_TYPE) {
                  drawCapsulePort(ctx, this, true, 0);
                } else if (nodeType(this) === UNPACK_TYPE || nodeType(this) === WIRELESS_UNPACK_TYPE) {
                  drawCapsulePort(ctx, this, false, 0);
                }'''
          sub(
              "web/wire_bus_visual.js",
              r"      if \(nodeType\(this\) === PACK_TYPE\) drawCapsulePort\(ctx, this, true, 0\);\n      else if \(nodeType\(this\) === UNPACK_TYPE\) drawCapsulePort\(ctx, this, false, 0\);\n      else if \(nodeType\(this\) === WIRELESS_PACK_TYPE\) \{.*?\n      \}",
              foreground,
              re.S,
          )

          # Named port resolver: physical BUS wins, channel is fallback.
          named_find = '''function findPackForUnpack(unpack) {
            if (nodeType(unpack) === WIRELESS_UNPACK_TYPE) {
              const physical = resolveSource(unpack?.graph, unpack?.inputs?.[0]?.link);
              if (physical && nodeType(physical.node) === WIRELESS_PACK_TYPE) return physical.node;
              const name = wirelessChannelName(unpack);
              if (!name) return null;
              for (const graph of [unpack.graph, app.graph]) {
                const pack = (graph?._nodes || []).find((node) =>
                  nodeType(node) === WIRELESS_PACK_TYPE && wirelessChannelName(node) === name
                );
                if (pack) return pack;
              }
              return null;
            }
            const source = resolveSource(unpack?.graph, unpack?.inputs?.[0]?.link);
            return source && nodeType(source.node) === PACK_TYPE ? source.node : null;
          }'''
          sub("web/wire_bus_named_ports.js", r"function findPackForUnpack\(unpack\) \{.*?\n\}\n\nfunction applyNames", named_find + "\n\nfunction applyNames", re.S)

          rep("web/h3_bus_resolver.js", 'export const H3_BUS_PACK_TYPE = "TerryXuWireBusPack";', 'export const H3_BUS_PACK_TYPE = "TerryXuWirelessBusPack";')
          rep("web/wire_bus_h3_output_compat.js", 'const PACK_TYPE = "TerryXuWireBusPack";', 'const PACK_TYPE = "TerryXuWirelessBusPack";')

          # 4. One switch UI owner. Remove competing timer-driven layers.
          rep(
              "web/line_switch.js",
              '  node.graph?.setDirtyCanvas?.(true, true);\n}\n\nfunction refreshBool(node) {',
              '  globalThis.__terrySyncSwitchUI?.(node);\n  node.graph?.setDirtyCanvas?.(true, true);\n}\n\nfunction refreshBool(node) {',
          )
          rep(
              "web/line_switch.js",
              '  node.graph?.setDirtyCanvas?.(true, true);\n}\n\nfunction refreshControllable(node) {',
              '  globalThis.__terrySyncSwitchUI?.(node);\n  node.graph?.setDirtyCanvas?.(true, true);\n}\n\nfunction refreshControllable(node) {',
          )
          rep(
              "web/line_switch.js",
              '  properties(node)[REMOTE_VALUE_PROPERTY] = description?.value ?? properties(node)[REMOTE_VALUE_PROPERTY];\n  node.graph?.setDirtyCanvas?.(true, true);\n}\n\nfunction refreshAllRemotes() {',
              '  properties(node)[REMOTE_VALUE_PROPERTY] = description?.value ?? properties(node)[REMOTE_VALUE_PROPERTY];\n  globalThis.__terrySyncSwitchUI?.(node);\n  node.graph?.setDirtyCanvas?.(true, true);\n}\n\nfunction refreshAllRemotes() {',
          )
          sub(
              "web/line_switch.js",
              r"  setup\(\) \{\n    patchCanvas\(\);\n    installExecutedListener\(\);\n    startAnimation\(\);\n    setInterval\(\(\) => \{.*?\n    \}, 500\);\n  \},",
              '''  setup() {
                  patchCanvas();
                  installExecutedListener();
                  startAnimation();
                },''',
              re.S,
          )
          sub(
              "web/switch_ui.js",
              r"  setup\(\) \{\n    setInterval\(\(\) => \{.*?\n    \}, 700\);\n  \},",
              '''  setup() {
                  globalThis.__terrySyncSwitchUI = (node) => {
                    if (isLine(node)) syncLine(node);
                    else if (isBool(node)) syncBool(node);
                    else if (isRemote(node)) syncRemote(node);
                  };
                },''',
              re.S,
          )

          for path in ("web/switch_input_names.js", "web/switch_named_combo.js"):
              p = Path(path)
              if p.exists(): p.unlink()

          # Self-clean temporary migration/fix workflows.
          for path in (
              ".github/workflows/terryxu-fix-current-20260906.yml",
              ".github/workflows/terryxu-fix-current-v2-20260906.yml",
          ):
              p = Path(path)
              if p.exists(): p.unlink()
          for path in (Path(".github/workflows"), Path(".github")):
              try: path.rmdir()
              except OSError: pass
          PY

      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for p in Path('.').rglob('*.py'):
              if '.git' not in p.parts:
                  ast.parse(p.read_text(encoding='utf-8'), filename=str(p))

          root = Path('__init__.py').read_text(encoding='utf-8')
          nodes = Path('nodes/__init__.py').read_text(encoding='utf-8')
          assert 'H3ShotTimeline' not in root and 'H3ShotTimeline' not in nodes

          menu = Path('web/h3_shared_menus.js').read_text(encoding='utf-8').split('function openAssetMenu(controller) {', 1)[1].split('function nextSpeaker', 1)[0]
          assert '可见主体' not in menu and '新建主体' not in menu and '已建立引用' not in menu
          assert '仅显示已连接的图片、视频和音频' in menu

          bus = Path('web/wire_bus.js').read_text(encoding='utf-8')
          defs = bus.split('addCustomNodeDefs(defs) {', 1)[1].split('beforeRegisterNodeDef', 1)[0]
          assert 'defs[PACK_TYPE]' not in defs and 'defs[UNPACK_TYPE]' not in defs
          assert 'defs[WIRELESS_PACK_TYPE]' in defs and 'defs[WIRELESS_UNPACK_TYPE]' in defs
          assert '[BUS_TYPE]' in defs and 'required: { bus: [BUS_TYPE' in defs

          visual = Path('web/wire_bus_visual.js').read_text(encoding='utf-8')
          assert 'nodeType(this) === WIRELESS_PACK_TYPE) && Number(slot) === 0' in visual
          assert 'nodeType(this) === WIRELESS_UNPACK_TYPE) && Number(slot) === 0' in visual

          assert not Path('web/switch_input_names.js').exists()
          assert not Path('web/switch_named_combo.js').exists()
          line = Path('web/line_switch.js').read_text(encoding='utf-8')
          sui = Path('web/switch_ui.js').read_text(encoding='utf-8')
          assert '}, 500);' not in line
          assert '}, 700);' not in sui
          assert '__terrySyncSwitchUI' in line and '__terrySyncSwitchUI' in sui
          PY
          for f in web/*.js; do node --check "$f"; done

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix H3, merged bus, and remote controls"
          git push origin HEAD:main
