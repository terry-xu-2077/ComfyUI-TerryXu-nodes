name: TerryXu H3 bus display source fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terryxu-h3-bus-display-source-20260906.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Bus-Out as visual source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('web/h3_prompt_editor.js')
          text = path.read_text(encoding='utf-8')

          normalize_pattern = re.compile(
              r'function normalizeLinks\(node\) \{.*?\n\}\n\nfunction addVirtualLink',
              re.S,
          )
          normalize_replacement = '''function normalizeLinks(node) {
            const graph = node?.graph || app.graph;
            const seen = new Set();
            const out = [];
            for (const link of ensureLinks(node)) {
              const id = Number(link?.source_id);
              const slot = Number(link?.source_slot) || 0;
              if (!Number.isFinite(id) || id === Number(node.id)) continue;
              const src = graph?.getNodeById?.(id);
              if (!src) continue;
              const kind = sourceType(src, slot, link?.source_type);
              const key = `${id}:${slot}`;
              if (seen.has(key)) continue;
              seen.add(key);
              out.push({
                source_id: id,
                source_slot: slot,
                source_type: String(src.outputs?.[slot]?.type || link?.source_type || "*"),
                kind,
              });
            }
            node.properties[LINKS_PROP] = out.slice(0, MAX_MEDIA);
            return node.properties[LINKS_PROP];
          }

          function addVirtualLink'''
          text, n = normalize_pattern.subn(normalize_replacement, text, count=1)
          if n != 1:
              raise RuntimeError(f'normalizeLinks replacement count={n}')

          add_pattern = re.compile(
              r'function addVirtualLink\(node, source, sourceSlot = 0, sourceTypeValue = ""\) \{.*?\n\}\n\nfunction getMediaInputIndex',
              re.S,
          )
          add_replacement = '''function addVirtualLink(node, source, sourceSlot = 0, sourceTypeValue = "") {
            if (!node || !source || Number(source.id) === Number(node.id)) return false;
            const links = normalizeLinks(node);
            if (links.length >= MAX_MEDIA) return false;
            if (links.some((x) => Number(x.source_id) === Number(source.id) && Number(x.source_slot) === Number(sourceSlot))) return false;
            links.push({
              source_id: Number(source.id),
              source_slot: Number(sourceSlot) || 0,
              source_type: String(sourceTypeValue || source.outputs?.[sourceSlot]?.type || "*"),
              kind: sourceType(source, sourceSlot, sourceTypeValue),
            });
            node.properties[LINKS_PROP] = links;
            watchSourceNode(source);
            node.setDirtyCanvas?.(true, true);
            app.graph?.setDirtyCanvas?.(true, true);
            app.graph?.change?.();
            refreshEditorsSoon();
            return true;
          }

          function getMediaInputIndex'''
          text, n = add_pattern.subn(add_replacement, text, count=1)
          if n != 1:
              raise RuntimeError(f'addVirtualLink replacement count={n}')

          prompt_pattern = re.compile(
              r'      normalizeLinks\(node\)\.forEach\(\(link, i\) => \{.*?      \}\);',
              re.S,
          )
          prompt_replacement = '''      let assetIndex = 0;
              for (const link of normalizeLinks(node)) {
                const displaySource = app.graph?.getNodeById?.(Number(link.source_id));
                const resolved = resolveVirtualMediaSource(displaySource, link.source_slot, link.source_type);
                const executionSource = resolved.node || displaySource;
                const executionId = Number(executionSource?.id);
                if (!executionSource || !Number.isFinite(executionId) || !output[String(executionId)]) continue;
                assetIndex += 1;
                dst.inputs[`asset${assetIndex}`] = [String(executionId), Number(resolved.slot) || 0];
              }'''
          text, n = prompt_pattern.subn(prompt_replacement, text, count=1)
          if n != 1:
              raise RuntimeError(f'graphToPrompt replacement count={n}')

          media_pattern = re.compile(
              r'function mediaOptions\(node\) \{.*?\n\}\n\nfunction watchSourceNode',
              re.S,
          )
          media_replacement = '''function mediaOptions(node) {
            const counts = { picture: 0, video: 0, audio: 0 };
            return normalizeLinks(node).map((link) => {
              const displaySource = app.graph?.getNodeById?.(Number(link.source_id));
              const resolved = resolveVirtualMediaSource(displaySource, link.source_slot, link.source_type);
              const src = resolved.node || displaySource;
              const slot = Number(resolved.slot) || 0;
              const kind = sourceType(src, slot, resolved.type || link.source_type);
              counts[kind] = (counts[kind] || 0) + 1;
              const index = counts[kind];
              const tag = kind === "picture" ? `<Picture ${index}>` : kind === "video" ? `<Video ${index}>` : `<Audio ${index}>`;
              const label = kind === "picture" ? `Picture ${index}` : kind === "video" ? `Video ${index}` : `Audio ${index}`;
              if (src && src !== displaySource) watchSourceNode(src);
              return {
                kind,
                index,
                tag,
                label,
                source: filenameFromSource(src, kind).split(/[\\\\/]/).pop() || src?.title || label,
                preview: previewFromSource(src, kind),
              };
            });
          }

          function watchSourceNode'''
          text, n = media_pattern.subn(media_replacement, text, count=1)
          if n != 1:
              raise RuntimeError(f'mediaOptions replacement count={n}')

          path.write_text(text, encoding='utf-8')

          wf = Path('.github/workflows/terryxu-h3-bus-display-source-20260906.yml')
          if wf.exists():
              wf.unlink()
          for folder in (Path('.github/workflows'), Path('.github')):
              try:
                  folder.rmdir()
              except OSError:
                  pass
          PY

      - name: Validate
        shell: bash
        run: |
          node --check web/h3_prompt_editor.js
          grep -q 'const displaySource = app.graph' web/h3_prompt_editor.js
          grep -q 'const executionSource = resolved.node' web/h3_prompt_editor.js
          grep -q 'source_id: Number(source.id)' web/h3_prompt_editor.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep Bus-Out as H3 visual reference source"
          git push origin main
