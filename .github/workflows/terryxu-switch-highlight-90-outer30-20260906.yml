name: TerryXu switch highlight 90 outer30

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terryxu-switch-highlight-90-outer30-20260906.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tune selected wire highlight
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/switch_wire_highlight.js')
          s = p.read_text(encoding='utf-8')
          old1 = 'const bright = lightenLinkColor(color, 0.76);'
          new1 = 'const bright = lightenLinkColor(color, 0.90);'
          old2 = 'ctx.lineWidth = width + 2.5;'
          new2 = 'ctx.lineWidth = (width + 2.5) * 1.3;'
          if old1 not in s:
              raise SystemExit('white-mix marker not found')
          if old2 not in s:
              raise SystemExit('outer-width marker not found')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/terryxu-switch-highlight-90-outer30-20260906.yml').unlink()
          PY
      - name: Validate
        shell: bash
        run: |
          node --check web/switch_wire_highlight.js
          grep -q 'lightenLinkColor(color, 0.90)' web/switch_wire_highlight.js
          grep -q '(width + 2.5) \* 1.3' web/switch_wire_highlight.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Increase selected wire highlight contrast"
          git push origin main
