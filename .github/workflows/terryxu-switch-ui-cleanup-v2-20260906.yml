name: TerryXu switch UI cleanup v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terryxu-switch-ui-cleanup-v2-20260906.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def r(p): return Path(p).read_text(encoding='utf-8')
          def w(p, s): Path(p).write_text(s, encoding='utf-8')
          def rep(p, a, b):
              s = r(p)
              if a not in s: raise RuntimeError(f'anchor not found: {p}: {a!r}')
              w(p, s.replace(a, b, 1))

          rep('nodes/line_switch.py', 'display_name="TerryXu 线路切换器"', 'display_name="线路切换器"')
          rep('nodes/bool_switch.py', 'display_name="TerryXu 二路布尔切换器"', 'display_name="二路切换器"')
          rep('nodes/bool_switch.py', 'description="使用布尔值在两路任意同类型输入之间切换，可通过 TerryXu 远程控制器按频道控制。"', 'description="使用布尔值在两路任意同类型输入之间切换，可通过远程控制器按名称控制。"')
          rep('nodes/bool_switch.py', 'display_name="关闭"', 'display_name="线路 1"')
          rep('nodes/bool_switch.py', 'display_name="开启"', 'display_name="线路 2"')

          for a,b in [
            ('lineTitle: "TerryXu 线路切换器",','lineTitle: "线路切换器",'),
            ('boolTitle: "TerryXu 二路布尔切换器",','boolTitle: "二路切换器",'),
            ('remoteTitle: "TerryXu 远程控制器",','remoteTitle: "远程控制器",'),
            ('falseInput: "关闭",','falseInput: "线路 1",'),
            ('trueInput: "开启",','trueInput: "线路 2",'),
            ('channel: "频道",','channel: "",'),
            ('boolChannel: "布尔切换",','boolChannel: "二路切换",'),
            ('remoteDescription: "按频道自动识别 TerryXu 节点控件，并生成对应的远程控制界面。",','remoteDescription: "按名称自动匹配可控节点，并生成对应的远程控制界面。",'),
            ('lineTitle: "TerryXu Line Switch",','lineTitle: "Line Switch",'),
            ('boolTitle: "TerryXu Boolean Switch",','boolTitle: "Two-Way Switch",'),
            ('remoteTitle: "TerryXu Remote Control",','remoteTitle: "Remote Control",'),
            ('falseInput: "Off",','falseInput: "Input 1",'),
            ('trueInput: "On",','trueInput: "Input 2",'),
            ('channel: "Channel",','channel: "",'),
            ('boolChannel: "Boolean Switch",','boolChannel: "Two-Way Switch",'),
            ('remoteDescription: "Detect TerryXu node controls by channel and build a matching remote control UI.",','remoteDescription: "Match controllable nodes by name and build the corresponding remote control UI.",'),
          ]: rep('web/line_switch.js', a, b)

          rep('web/switch_ui.js', '? { route: "线路", off: "关闭", on: "开启", rename: "重命名线路" }', '? { route: "线路", input1: "线路 1", input2: "线路 2", rename: "重命名线路" }')
          rep('web/switch_ui.js', ': { route: "Route", off: "Off", on: "On", rename: "Rename route" };', ': { route: "Route", input1: "Input 1", input2: "Input 2", rename: "Rename route" };')
          rep('web/switch_ui.js', 'return String(boolNames(node)[enabled ? "true" : "false"] || "").trim() || (enabled ? labels().on : labels().off);', 'return String(boolNames(node)[enabled ? "true" : "false"] || "").trim() || (enabled ? labels().input2 : labels().input1);')

          s = r('web/switch_ui.js')
          anchor = 'function allGraphs(root = app.graph) {'
          if anchor not in s: raise RuntimeError('allGraphs anchor missing')
          handler = '''function installNodes2RenameHandler() {
            if (typeof document === "undefined" || globalThis.__terrySwitchNodes2RenameHandler) return;
            globalThis.__terrySwitchNodes2RenameHandler = true;
            document.addEventListener("pointerdown", (event) => {
              if (event.button != null && event.button !== 0) return;
              const target = event.target;
              if (!target?.closest) return;
              if (target.closest('[data-testid="slot-connection-dot"], [data-testid="slot-dot"]')) return;
              const row = target.closest(".lg-slot--input");
              const root = row?.closest?.("[data-node-id]");
              if (!row || !root || !String(row.textContent || "").includes("✎")) return;
              const id = root.getAttribute("data-node-id");
              const node = nodes().find((item) => String(item?.id) === String(id));
              if (!node || (!isLine(node) && !isBool(node))) return;
              const editableRows = [...root.querySelectorAll(".lg-slot--input")].filter((item) => String(item.textContent || "").includes("✎"));
              const entry = renameEntries(node)[editableRows.indexOf(row)];
              if (!entry) return;
              event.preventDefault?.();
              event.stopPropagation?.();
              const next = globalThis.prompt?.(labels().rename, entry.label);
              if (next == null) return;
              entry.set(next);
              if (isLine(node)) syncLine(node); else syncBool(node);
              syncRemotes();
              node.graph?.setDirtyCanvas?.(true, true);
              node.graph?.change?.();
            }, true);
          }

          function allGraphs(root = app.graph) {'''
          w('web/switch_ui.js', s.replace(anchor, handler, 1))

          s = r('web/switch_ui.js')
          setup_anchor = '  setup() {\n        globalThis.__terrySyncSwitchUI = (node) => {'
          if setup_anchor not in s: raise RuntimeError('setup anchor missing')
          w('web/switch_ui.js', s.replace(setup_anchor, '  setup() {\n        installNodes2RenameHandler();\n        globalThis.__terrySyncSwitchUI = (node) => {', 1))

          for p in ('web/wire_bus.js','locales/zh/nodeDefs.json','locales/en/nodeDefs.json'):
              s = r(p).replace('⛓️‍💥','').replace('🔗','')
              w(p,s)

          for p in (
            '.github/workflows/terryxu-switch-ui-cleanup-20260906.yml',
            '.github/workflows/terryxu-switch-ui-cleanup-v2-20260906.yml',
          ):
              q=Path(p)
              if q.exists(): q.unlink()
          for q in (Path('.github/workflows'),Path('.github')):
              try: q.rmdir()
              except OSError: pass
          PY

      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for p in Path('.').rglob('*.py'):
              if '.git' not in p.parts: ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          a=Path('nodes/line_switch.py').read_text(encoding='utf-8')
          b=Path('nodes/bool_switch.py').read_text(encoding='utf-8')
          l=Path('web/line_switch.js').read_text(encoding='utf-8')
          s=Path('web/switch_ui.js').read_text(encoding='utf-8')
          assert 'display_name="线路切换器"' in a
          assert 'display_name="二路切换器"' in b and 'display_name="线路 1"' in b and 'display_name="线路 2"' in b
          assert 'lineTitle: "线路切换器"' in l and 'boolTitle: "二路切换器"' in l and 'remoteTitle: "远程控制器"' in l
          assert 'channel: ""' in l and '频道' not in l.split('function text()',1)[1].split('function nodeType',1)[0]
          assert 'installNodes2RenameHandler();' in s and 'input1: "线路 1"' in s and 'input2: "线路 2"' in s
          for p in ('web/wire_bus.js','locales/zh/nodeDefs.json','locales/en/nodeDefs.json'):
              x=Path(p).read_text(encoding='utf-8'); assert '⛓️‍💥' not in x and '🔗' not in x
          PY
          for f in web/*.js; do node --check "$f"; done

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish switch names and Nodes 2.0 rename UI"
          git push origin main
