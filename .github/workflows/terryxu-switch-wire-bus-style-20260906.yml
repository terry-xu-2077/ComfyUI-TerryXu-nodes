name: TerryXu bus-style switch wire redraw
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terryxu-switch-wire-bus-style-20260906.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        shell: bash
        run: |
          echo '' | base64 -d | python
      - name: Validate
        shell: bash
        run: |
          node --check web/switch_ui.js
          grep -q 'hideSelectedSwitchLinksForNativeDraw' web/switch_ui.js
          grep -q 'patchSwitchWireCanvas(app.canvas)' web/switch_ui.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use bus visual strategy for selected switch wires"
          git push origin main
