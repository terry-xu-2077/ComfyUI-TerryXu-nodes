name: TerryXu H3 @ menu bus metadata fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terryxu-h3-at-menu-bus-meta-20260906.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix H3 @ menu media source resolution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/h3_shared_menus.js')
          text = path.read_text(encoding='utf-8')

          old = '''function kindOf(src, slot, fallback = "") {
            const type = String(src?.outputs?.[slot]?.type || fallback || "").toUpperCase();
            if (type.includes("AUDIO")) return "audio";
            if (type.includes("VIDEO")) return "video";
            return "picture";
          }
          function filename(src, kind) {'''
          new = '''function kindOf(src, slot, fallback = "") {
            const type = String(src?.outputs?.[slot]?.type || fallback || "").toUpperCase();
            if (type.includes("AUDIO")) return "audio";
            if (type.includes("VIDEO")) return "video";
            return "picture";
          }
          function resolveAssetSource(src, slot = 0, fallbackType = "") {
            let node = src;
            let resolvedSlot = Number(slot) || 0;
            try {
              const resolved = src?.resolveVirtualOutput?.(resolvedSlot);
              if (resolved?.node) {
                node = resolved.node;
                resolvedSlot = Number(resolved.slot) || 0;
              }
            } catch {}
            return {
              node,
              slot: resolvedSlot,
              type: String(node?.outputs?.[resolvedSlot]?.type || fallbackType || "*"),
            };
          }
          function filename(src, kind) {'''
          if old not in text:
              raise RuntimeError('kindOf anchor not found')
          text = text.replace(old, new, 1)

          old_assets = '''function assets(node, mode) {
            const count = { picture: 0, video: 0, audio: 0 }, out = [], seen = new Set();
            for (const link of links(node, mode)) {
              const id = Number(link?.source_id), slot = Number(link?.source_slot) || 0, key = `${id}:${slot}`;
              if (!Number.isFinite(id) || seen.has(key)) continue;
              const src = graphNode(node, id);
              if (!src) continue;
              seen.add(key);
              const kind = link.kind || kindOf(src, slot, link.source_type);
              count[kind] = (count[kind] || 0) + 1;
              const index = count[kind];
              const english = kind === "picture" ? `Picture ${index}` : kind === "video" ? `Video ${index}` : `Audio ${index}`;
              const chinese = kind === "picture" ? `图片 ${index}` : kind === "video" ? `视频 ${index}` : `音频 ${index}`;
              out.push({ key, kind, index, raw: `<${english}>`, label: english, displayLabel: chinese, src, name: filename(src, kind).split(/[\\\\/]/).pop() || src.title || english, preview: preview(src, kind) });
            }
            return out;
          }'''
          new_assets = '''function assets(node, mode) {
            const count = { picture: 0, video: 0, audio: 0 }, out = [], seen = new Set();
            for (const link of links(node, mode)) {
              const id = Number(link?.source_id), slot = Number(link?.source_slot) || 0, key = `${id}:${slot}`;
              if (!Number.isFinite(id) || seen.has(key)) continue;
              const displaySrc = graphNode(node, id);
              if (!displaySrc) continue;
              seen.add(key);
              const resolved = resolveAssetSource(displaySrc, slot, link.source_type);
              const src = resolved.node || displaySrc;
              const sourceSlot = Number(resolved.slot) || 0;
              const kind = kindOf(src, sourceSlot, resolved.type || link.source_type);
              count[kind] = (count[kind] || 0) + 1;
              const index = count[kind];
              const english = kind === "picture" ? `Picture ${index}` : kind === "video" ? `Video ${index}` : `Audio ${index}`;
              const chinese = kind === "picture" ? `图片 ${index}` : kind === "video" ? `视频 ${index}` : `音频 ${index}`;
              out.push({
                key,
                kind,
                index,
                raw: `<${english}>`,
                label: english,
                displayLabel: chinese,
                src,
                name: filename(src, kind).split(/[\\\\/]/).pop() || src.title || english,
                preview: preview(src, kind),
              });
            }
            return out;
          }'''
          if old_assets not in text:
              raise RuntimeError('assets anchor not found')
          text = text.replace(old_assets, new_assets, 1)
          path.write_text(text, encoding='utf-8')

          wf = Path('.github/workflows/terryxu-h3-at-menu-bus-meta-20260906.yml')
          if wf.exists():
              wf.unlink()
          for folder in (Path('.github/workflows'), Path('.github')):
              try:
                  folder.rmdir()
              except OSError:
                  pass
          PY

      - name: Validate
        shell: bash
        run: |
          node --check web/h3_shared_menus.js
          grep -q 'function resolveAssetSource' web/h3_shared_menus.js
          grep -q 'const displaySrc = graphNode' web/h3_shared_menus.js
          grep -q 'const resolved = resolveAssetSource' web/h3_shared_menus.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve Bus-Out media in H3 @ menu"
          git push origin main
