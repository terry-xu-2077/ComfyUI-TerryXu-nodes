name: TerryXu preserve BUS output links

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terryxu-preserve-bus-output-link-20260907.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve restored BUS output object
        shell: python
        run: |
          from pathlib import Path

          path = Path("web/wire_bus.js")
          text = path.read_text(encoding="utf-8")

          old = '''function ensureUnpackBusOutput(unpack) {
            const outputs = unpack.outputs || [];
            const current = outputs[0];
            const alreadyBusOnly = outputs.length === 1
              && String(current?.type || "").toUpperCase() === BUS_TYPE
              && current?.[BUS_OUTPUT_FIELD] === true;

            if (!alreadyBusOnly) {
              removeAllOutputs(unpack);
              const added = unpack.addOutput?.("bus", BUS_TYPE);
              const output = unpack.outputs?.[0] || added;
              if (output) {
                output.name = "bus";
                output.label = labels().bus;
                output.type = BUS_TYPE;
                output[BUS_OUTPUT_FIELD] = true;
                delete output[LANE_FIELD];
              }
            } else {
              current.name = "bus";
              current.label = labels().bus;
              current.type = BUS_TYPE;
            }

            nodeProperties(unpack)[UNPACK_LANES_PROPERTY] = [];
          }'''

          new = '''function ensureUnpackBusOutput(unpack) {
            const outputs = unpack.outputs || [];
            const current = outputs[0];

            // Dynamic slot metadata is not guaranteed to round-trip through every
            // ComfyUI graph serializer. A restored BUS-only output can therefore
            // lose BUS_OUTPUT_FIELD even though it is still the same physical slot.
            // Reuse that slot in place so its outgoing links survive reload.
            // A real expanded lane always carries LANE_FIELD, so toggling from an
            // expanded single-lane output still rebuilds the slot as intended.
            const alreadyBusOnly = outputs.length === 1
              && String(current?.type || "").toUpperCase() === BUS_TYPE
              && (
                current?.[BUS_OUTPUT_FIELD] === true
                || !current?.[LANE_FIELD]
              );

            if (!alreadyBusOnly) {
              removeAllOutputs(unpack);
              const added = unpack.addOutput?.("bus", BUS_TYPE);
              const output = unpack.outputs?.[0] || added;
              if (output) {
                output.name = "bus";
                output.label = labels().bus;
                output.type = BUS_TYPE;
                output[BUS_OUTPUT_FIELD] = true;
                delete output[LANE_FIELD];
              }
            } else {
              current.name = "bus";
              current.label = labels().bus;
              current.type = BUS_TYPE;
              current[BUS_OUTPUT_FIELD] = true;
              delete current[LANE_FIELD];
              for (const linkId of current.links || []) {
                syncConnectionType(unpack.graph, linkId, BUS_TYPE);
              }
            }

            nodeProperties(unpack)[UNPACK_LANES_PROPERTY] = [];
          }'''

          if old not in text:
              raise RuntimeError("ensureUnpackBusOutput anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/terryxu-preserve-bus-output-link-20260907.yml")
          workflow.unlink(missing_ok=True)
          for folder in (Path(".github/workflows"), Path(".github")):
              try:
                  folder.rmdir()
              except OSError:
                  pass

      - name: Validate
        shell: bash
        run: |
          node --check web/wire_bus.js
          grep -q 'current?.\[BUS_OUTPUT_FIELD\] === true' web/wire_bus.js
          grep -q '!current?.\[LANE_FIELD\]' web/wire_bus.js
          grep -q 'syncConnectionType(unpack.graph, linkId, BUS_TYPE)' web/wire_bus.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve BUS output links across reload"
          git push origin main
